name: Performance Architecture Audit V2
on:
  push:
    branches: ["audit/performance-architecture-v2"]
    paths:
      - "scripts/performance-architecture-audit-v2.mjs"
      - ".github/workflows/performance-architecture-audit-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-architecture-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production validation + stability
        run: npm run check
      - name: Run Performance Architecture Audit V2
        run: node scripts/performance-architecture-audit-v2.mjs
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/performance-architecture-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record Performance Architecture V2 report"
          git push

name: Performance V4
on:
  push:
    branches: ["perf/scoped-table-observer-v4"]
    paths:
      - "ly-performance-optimizer.js"
      - "scripts/apply-performance-v4.mjs"
      - ".github/workflows/performance-v4.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/scoped-table-observer-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Core-38 wiring
        run: node scripts/apply-performance-v4.mjs
      - name: Validate runtime and stability
        run: npm run check
      - name: Commit validated Core-38 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: wire scoped table observer V4 into Core-38"
          git push

name: Refactor Reports UI
on:
  push:
    branches: ["refactor/reports-module"]
    paths:
      - "scripts/extract-reports-ui.mjs"
      - ".github/workflows/refactor-reports-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract_reports:
    if: ${{ !contains(github.event.head_commit.message, '[reports-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reports refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Reports UI when needed
        run: node scripts/extract-reports-ui.mjs
      - name: Validate refactored runtime
        run: npm run validate
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-reports.js refactor/reports-extraction-result.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: extract Reports UI [reports-extracted]"
          git push

name: Refactor Settings UI
on:
  push:
    branches: ["refactor/settings-ui-module"]
    paths:
      - "scripts/extract-settings-ui.mjs"
      - ".github/workflows/refactor-settings-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract_settings:
    if: ${{ !contains(github.event.head_commit.message, '[settings-ui-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Settings refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Settings UI when needed
        run: node scripts/extract-settings-ui.mjs
      - name: Validate refactored runtime
        run: npm run validate
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-settings-ui.js refactor/settings-ui-extraction-result.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: extract Settings UI [settings-ui-extracted]"
          git push

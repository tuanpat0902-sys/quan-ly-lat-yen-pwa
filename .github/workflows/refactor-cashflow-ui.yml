name: Refactor Cashflow UI
on:
  push:
    branches: ["refactor/cashflow-ui-module"]
    paths:
      - "scripts/extract-cashflow-ui.mjs"
      - ".github/workflows/refactor-cashflow-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract_cashflow:
    if: ${{ !contains(github.event.head_commit.message, '[cashflow-ui-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cashflow refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Cashflow UI when needed
        run: node scripts/extract-cashflow-ui.mjs
      - name: Validate refactored runtime
        run: npm run validate
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-cashflow.js refactor/cashflow-extraction-result.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: extract Cashflow UI [cashflow-ui-extracted]"
          git push

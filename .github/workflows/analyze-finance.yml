name: Analyze Finance Refactor

on:
  push:
    branches: ["refactor/finance-module"]
    paths:
      - "scripts/analyze-finance.mjs"
      - ".github/workflows/analyze-finance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "finance-refactor-analysis"
  cancel-in-progress: true

jobs:
  analyze_finance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finance refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Analyze Finance dependency boundaries
        run: node scripts/analyze-finance.mjs
      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refactor/finance-analysis.md
          if git diff --cached --quiet; then
            echo "Finance analysis unchanged"
            exit 0
          fi
          git commit -m "chore: refresh Finance analysis [finance-analysis-output]"
          git push

name: Refactor Special Reports UI
on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/extract-special-reports-ui.mjs"
      - ".github/workflows/refactor-special-reports-ui.yml"
      - "ly-special-reports-bridge.js"
      - "sw.js"
      - "scripts/validate.mjs"
  push:
    branches: ["refactor/special-reports-module"]
    paths:
      - "scripts/extract-special-reports-ui.mjs"
      - ".github/workflows/refactor-special-reports-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract_special_reports:
    if: ${{ !contains(github.event.head_commit.message, '[special-reports-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Special Reports UI when needed
        run: node scripts/extract-special-reports-ui.mjs
      - name: Validate refactored runtime
        run: npm run validate
      - name: Commit validated extraction
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-special-reports.js refactor/special-reports-extraction-result.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: extract Special Reports UI [special-reports-extracted]"
          git push

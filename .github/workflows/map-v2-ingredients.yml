name: Map V2 Ingredients Takeover
on:
  push:
    branches: [rewrite/v2-ingredients-takeover]
    paths:
      - 'scripts/map-legacy-ingredients.mjs'
      - '.github/workflows/map-v2-ingredients.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/map-legacy-ingredients.mjs

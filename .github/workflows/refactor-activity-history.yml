name: Refactor Activity History

# Revision 2: trigger guarded extraction on the refactor branch.
on:
  push:
    branches: ["refactor/activity-history-module"]
    paths:
      - "scripts/extract-activity-history.mjs"
      - ".github/workflows/refactor-activity-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "activity-history-refactor"
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[activity-history-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Activity History UI
        run: node scripts/extract-activity-history.mjs

      - name: Validate refactored runtime
        run: npm run validate

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-activity-history.js refactor/activity-history-extraction-result.md
          if git diff --cached --quiet; then
            echo "No refactor changes"
            exit 0
          fi
          git commit -m "refactor: extract Activity History UI [activity-history-extracted]"
          git push

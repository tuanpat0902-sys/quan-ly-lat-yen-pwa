name: Fresh Install Stability Fix
on:
  push:
    branches: ["fix/fresh-install-stability"]
    paths:
      - "scripts/apply-fresh-bootstrap.mjs"
      - "scripts/stability-audit.mjs"
      - "scripts/validate.mjs"
      - "package.json"
      - ".github/workflows/fix-fresh-install-stability.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "sw.js"
      - "ly-*-bridge.js"
      - "ly-module-loader.js"
      - "scripts/stability-audit.mjs"
      - "scripts/validate.mjs"
      - "package.json"
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply fresh-install bootstrap on fix branch
        if: github.event_name == 'push'
        run: node scripts/apply-fresh-bootstrap.mjs
      - name: Production validation
        run: npm run validate
      - name: Stability audit
        run: npm run stability
      - name: Commit validated bootstrap
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: fresh-install bootstrap and Core-36 [stability-fixed]"
          git push

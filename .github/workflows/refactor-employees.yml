name: Refactor Employees UI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "employees-refactor-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  extract_employees:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/employees-module' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout employees refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/employees-module
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Employees UI when needed
        run: |
          if grep -Eq 'function[[:space:]]+renderEmployees[[:space:]]*\(' index.html; then
            node scripts/extract-employees.mjs
          else
            echo "Employees UI already extracted"
          fi

      - name: Validate refactored runtime
        run: npm run validate

      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-employees.js refactor/employees-extraction-result.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "refactor: extract Employees UI [employees-extracted]"
          git push origin HEAD:refactor/employees-module

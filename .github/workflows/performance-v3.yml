name: Performance V3
on:
  push:
    branches: ["perf/adaptive-leader-v3"]
    paths:
      - "ly-performance-optimizer.js"
      - "scripts/apply-performance-v3.mjs"
      - ".github/workflows/performance-v3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/adaptive-leader-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Core-37 wiring
        run: node scripts/apply-performance-v3.mjs
      - name: Validate runtime and stability
        run: npm run check
      - name: Commit validated Core-37 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: wire Adaptive Leader V3 into Core-37"
          git push

name: Fresh Core V3 Employees CI

on:
  push:
    branches:
      - main
    paths:
      - 'src-v3/app/bootstrap.js'
      - 'src-v3/domains/employees/**'
      - 'src-v3/data/supabase/employees-directory-source.js'
      - 'src-v3/migration-plan.json'
      - 'ly-fresh-core-v3-employees-parity-runner.js'
      - 'ly-module-loader.js'
      - 'scripts/test-fresh-core-v3-employees-runtime-parity.mjs'
      - 'scripts/test-fresh-core-v3-employees-device-parity-observation.mjs'
      - 'scripts/test-fresh-core-v3-employees-manual-device-runner.mjs'
      - 'scripts/test-fresh-core-v3-employees-device-runner-ui.mjs'
      - 'scripts/test-fresh-core-v3-employees-migration-plan.mjs'
      - 'scripts/test-fresh-core-v3-employees-controlled-seed-review.mjs'
      - 'scripts/test-fresh-core-v3-employees-empty-domain-hold.mjs'
      - '.github/workflows/fresh-core-v3-employees.yml'
  pull_request:
    paths:
      - 'src-v3/app/bootstrap.js'
      - 'src-v3/domains/employees/**'
      - 'src-v3/data/supabase/employees-directory-source.js'
      - 'src-v3/migration-plan.json'
      - 'ly-fresh-core-v3-employees-parity-runner.js'
      - 'ly-module-loader.js'
      - 'scripts/test-fresh-core-v3-employees-runtime-parity.mjs'
      - 'scripts/test-fresh-core-v3-employees-device-parity-observation.mjs'
      - 'scripts/test-fresh-core-v3-employees-manual-device-runner.mjs'
      - 'scripts/test-fresh-core-v3-employees-device-runner-ui.mjs'
      - 'scripts/test-fresh-core-v3-employees-migration-plan.mjs'
      - 'scripts/test-fresh-core-v3-employees-controlled-seed-review.mjs'
      - 'scripts/test-fresh-core-v3-employees-empty-domain-hold.mjs'
      - '.github/workflows/fresh-core-v3-employees.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test manual employees runtime parity
        run: node scripts/test-fresh-core-v3-employees-runtime-parity.mjs
      - name: Test device-local employees parity observation
        run: node scripts/test-fresh-core-v3-employees-device-parity-observation.mjs
      - name: Test manual device parity runner
        run: node scripts/test-fresh-core-v3-employees-manual-device-runner.mjs
      - name: Test manual device runner UI guard
        run: node scripts/test-fresh-core-v3-employees-device-runner-ui.mjs
      - name: Test V3-6 migration-plan gate
        run: node scripts/test-fresh-core-v3-employees-migration-plan.mjs
      - name: Test V3-6 controlled seed review evaluator
        run: node scripts/test-fresh-core-v3-employees-controlled-seed-review.mjs
      - name: Test V3-6 empty production domain hold
        run: node scripts/test-fresh-core-v3-employees-empty-domain-hold.mjs

name: Patch Authoritative Index Source

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'deploy/source-index-v2-authoritative'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch index.html source
        run: node scripts/patch-index-source.mjs
      - name: Commit authoritative source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source patch needed"
            exit 0
          fi
          git commit -m "fix: persist Ver 2.1.0 and V2 warehouse delete in index"
          git push origin HEAD:${{ github.head_ref }}

name: Refactor Finance UI

on:
  push:
    branches: ["refactor/finance-module"]
    paths:
      - "scripts/extract-finance-ui.mjs"
      - ".github/workflows/refactor-finance-ui.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "finance-ui-refactor"
  cancel-in-progress: true

jobs:
  extract_finance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Finance refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/finance-module
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Finance UI when needed
        run: |
          if grep -Eq 'function[[:space:]]+renderFinance[[:space:]]*\(' index.html; then
            node scripts/extract-finance-ui.mjs
          else
            echo "Finance UI already extracted"
          fi
      - name: Validate refactored runtime
        run: npm run validate
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-finance.js refactor/finance-extraction-result.md
          if git diff --cached --quiet; then
            echo "No generated Finance changes"
            exit 0
          fi
          git commit -m "refactor: extract Finance UI [finance-ui-extracted]"
          git push origin HEAD:refactor/finance-module

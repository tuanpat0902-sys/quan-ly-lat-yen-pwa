name: Analyze History Extraction

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/analyze-history.mjs"
      - ".github/workflows/refactor-history-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "history-refactor-analysis"
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[history-analysis-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Analyze full index.html
        run: node scripts/analyze-history.mjs

      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refactor/history-analysis.md refactor/history-candidate.js refactor/activity-history-block.js refactor/activity-history-region.txt
          if git diff --cached --quiet; then
            echo "Analysis output unchanged"
            exit 0
          fi
          git commit -m "chore: refresh history extraction analysis [history-analysis-output]"
          git push

  extract:
    if: ${{ !contains(github.event.head_commit.message, '[history-analysis-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Activity History refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/activity-history-module
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Activity History UI
        run: node scripts/extract-activity-history.mjs

      - name: Validate refactored runtime
        run: npm run validate

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-activity-history.js refactor/activity-history-extraction-result.md
          if git diff --cached --quiet; then
            echo "No generated refactor changes"
            exit 0
          fi
          git commit -m "refactor: extract Activity History UI [activity-history-extracted]"
          git push origin HEAD:refactor/activity-history-module

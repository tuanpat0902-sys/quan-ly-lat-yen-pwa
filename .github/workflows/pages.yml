name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the release files
        run: node scripts/prepare-pages-artifact.mjs --check

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          python - <<'PY'
          from pathlib import Path

          p = Path('_site/ly-local-chatbot.js')
          s = p.read_text(encoding='utf-8')
          old_version = "const VERSION='2026.08.25.18';"
          if old_version not in s:
              raise SystemExit('Unexpected local chatbot version')
          s = s.replace(old_version, "const VERSION='2026.08.25.21';", 1)

          anchor = "const uid=()=>globalThis.crypto?.randomUUID?.()||`local-${Date.now()}-${Math.random().toString(16).slice(2)}`;"
          helper = "function originalPhrase(message,folded){\n  const target=normalize(folded),raw=text(message).normalize('NFC');\n  if(!target)return text(folded);\n  const words=raw.match(/[\\p{L}\\p{M}0-9]+/gu)||[];\n  for(let start=0;start<words.length;start++){\n    for(let end=words.length;end>start;end--){\n      const candidate=words.slice(start,end).join(' ');\n      if(normalize(candidate)===target)return candidate;\n    }\n  }\n  return text(folded);\n}\n"
          if 'function originalPhrase(message,folded)' not in s:
              if anchor not in s:
                  raise SystemExit('Missing local chatbot helper anchor')
              s = s.replace(anchor, helper + anchor, 1)

          old = "query:phrase,quantity:kind==='stocktake'?amount.quantity:(amount.quantity!==null&&amount.quantity>0?amount.quantity:null)"
          new = "query:originalPhrase(message,phrase),quantity:kind==='stocktake'?amount.quantity:(amount.quantity!==null&&amount.quantity>0?amount.quantity:null)"
          if old not in s:
              raise SystemExit('Missing ambiguity query anchor')
          s = s.replace(old, new, 1)

          old_top = "const balances=data.inventory.filter(row=>!warehouseId||String(row.warehouse_id)===warehouseId),positive=balances.filter(row=>Number(row.quantity||0)>0),zero=balances.filter(row=>Number(row.quantity||0)<=0),topStock=positive.map(row=>({name:data.ingredients.find(item=>String(item.id)===String(row.ingredient_id))?.name||'Nguyên liệu đã xóa',quantity:Number(row.quantity||0)})).sort((a,b)=>b.quantity-a.quantity).slice(0,3);"
          new_top = "const balances=data.inventory.filter(row=>!warehouseId||String(row.warehouse_id)===warehouseId),positive=balances.filter(row=>Number(row.quantity||0)>0),zero=balances.filter(row=>Number(row.quantity||0)<=0),topStock=positive.map(row=>{const ingredient=data.ingredients.find(item=>String(item.id)===String(row.ingredient_id));return {name:ingredient?.name||'Nguyên liệu đã xóa',unit:text(ingredient?.unit),quantity:Number(row.quantity||0)};}).sort((a,b)=>b.quantity-a.quantity).slice(0,3);"
          if old_top not in s:
              raise SystemExit('Missing inventory top-stock anchor')
          s = s.replace(old_top, new_top, 1)

          old_summary = "${topStock.map(row=>`${row.name} ${formatNumber(row.quantity)}`).join(', ')}"
          new_summary = "${topStock.map(row=>`${row.name} ${formatNumber(row.quantity)}${row.unit?` ${row.unit}`:''}`).join(', ')}"
          if old_summary not in s:
              raise SystemExit('Missing inventory summary formatter anchor')
          s = s.replace(old_summary, new_summary, 1)

          ask_anchor = "async function askAi(message,localReply,reply={}){\n  const client=supabaseClient();"
          ask_new = "async function askAi(message,localReply,reply={}){\n  const verifiedReportIntent=/(bao cao|thong ke|tong quan|doanh thu|ton kho|thu chi|dong tien|chi phi|nhap xuat|ban duoc|ban hang|ban chay|mon nao ban|loi nhuan|lai rong|lai lo|bang luong|quy luong|tien luong|luong nhan vien|luong)/.test(normalize(message));\n  if(reply?.report||verifiedReportIntent)return localReply;\n  const client=supabaseClient();"
          if ask_anchor not in s:
              raise SystemExit('Missing askAi anchor')
          s = s.replace(ask_anchor, ask_new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('_site/ly-module-loader.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const VERSION='2026.08.26.10';", "const VERSION='2026.08.26.13';", 1)
          s = s.replace("ly-local-chatbot.js?v=20260825.18", "ly-local-chatbot.js?v=20260825.21", 1)
          s = s.replace("__lyLocalAssistant?.version==='2026.08.25.18'", "__lyLocalAssistant?.version==='2026.08.25.21'", 1)
          s = s.replace("ly-chat-unit-sync.js?v=20260826.4", "ly-chat-unit-sync.js?v=20260826.8", 1)
          s = s.replace("__lyChatUnitSync?.version==='2026.08.26.4'", "__lyChatUnitSync?.version==='2026.08.26.8'", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('_site/sw.js')
          s = p.read_text(encoding='utf-8').replace('lat-yen-fresh-core-v2-authoritative-150','lat-yen-fresh-core-v2-authoritative-152',1)
          p.write_text(s, encoding='utf-8')

          p = Path('_site/runtime-version.json')
          s = p.read_text(encoding='utf-8').replace('lat-yen-fresh-core-v2-authoritative-150','lat-yen-fresh-core-v2-authoritative-152',1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -q "const VERSION='2026.08.25.21'" _site/ly-local-chatbot.js
          grep -q "query:originalPhrase(message,phrase)" _site/ly-local-chatbot.js
          grep -q "unit:text(ingredient?.unit)" _site/ly-local-chatbot.js
          grep -q "verifiedReportIntent" _site/ly-local-chatbot.js
          grep -q "reply?.report||verifiedReportIntent" _site/ly-local-chatbot.js
          grep -q "const VERSION='2026.08.26.13'" _site/ly-module-loader.js
          grep -q "ly-local-chatbot.js?v=20260825.21" _site/ly-module-loader.js
          grep -q "ly-chat-unit-sync.js?v=20260826.8" _site/ly-module-loader.js
          grep -q "lat-yen-fresh-core-v2-authoritative-152" _site/sw.js
          grep -q "lat-yen-fresh-core-v2-authoritative-152" _site/runtime-version.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the release files
        run: |
          node scripts/check-release-consistency.mjs
          node scripts/test-chat-language-plus.mjs
          node scripts/test-chat-sales-query.mjs
          node scripts/test-chat-sales-insights.mjs
          node scripts/test-chat-router-sales-revenue-card.mjs
          node scripts/test-chat-response-guard.mjs
          node scripts/prepare-pages-artifact.mjs --check

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          node scripts/check-release-consistency.mjs
          grep -q "externalAi:false" _site/ly-chat-local-only.js
          grep -q "IDBObjectStore" _site/ly-chat-response-gate.js
          grep -q "ly-chat-router.js" _site/sw.js
          grep -q "ly-sales-report-revenue-card.js" _site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

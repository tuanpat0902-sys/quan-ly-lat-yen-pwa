name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Pages artifact contract
        run: node scripts/prepare-pages-artifact.mjs --check

      - name: Build minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          # Deploy source-of-truth runtime; do not let stale prepare constants
          # downgrade chatbot/runtime generations.
          sed -E -i "s#ly-module-loader\.js\?v=[^\"']+#ly-module-loader.js?v=20260825.54#g" _site/index.html
          sed -i "s/const VERSION='2026.08.25.52';/const VERSION='2026.08.25.54';/" _site/ly-module-loader.js
          sed -i "s#ly-chat-unit-normalizer.js?v=20260825.4#ly-chat-unit-normalizer.js?v=20260825.7#" _site/ly-module-loader.js
          sed -i "s/__lyChatUnitNormalizer?.version==='2026.08.25.4'/__lyChatUnitNormalizer?.version==='2026.08.25.7'/" _site/ly-module-loader.js
          sed -i "s/lat-yen-fresh-core-v2-authoritative-105/lat-yen-fresh-core-v2-authoritative-107/" _site/sw.js

          grep -q "ly-module-loader.js?v=20260825.54" _site/index.html
          grep -q "ly-chat-unit-normalizer.js?v=20260825.7" _site/ly-module-loader.js
          grep -q "__lyChatUnitNormalizer?.version==='2026.08.25.7'" _site/ly-module-loader.js
          grep -q "lat-yen-fresh-core-v2-authoritative-107" _site/sw.js
          grep -q "ly-chat-stock-command-normalizer-v4.js?v=20260825.4" _site/ly-chat-unit-normalizer.js
          grep -q "ly-chat-stock-submit-gate.js?v=20260825.1" _site/ly-chat-unit-normalizer.js
          grep -q "legacyDisabled:true" _site/ly-chat-stock-command-normalizer.js

          echo 'Pages artifact files:'
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

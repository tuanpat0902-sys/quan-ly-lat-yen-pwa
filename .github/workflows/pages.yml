name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the release files
        run: node scripts/prepare-pages-artifact.mjs --check

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          grep -q "const VERSION='2026.08.26.19'" _site/ly-local-chatbot.js
          grep -q "query:originalPhrase(message,phrase)" _site/ly-local-chatbot.js
          grep -q "unit:text(ingredient?.unit)" _site/ly-local-chatbot.js
          grep -q "verifiedReportIntent" _site/ly-local-chatbot.js
          grep -q "reply?.report||verifiedReportIntent" _site/ly-local-chatbot.js
          grep -q "const VERSION='2026.08.26.11'" _site/ly-module-loader.js
          grep -q "ly-local-chatbot.js?v=20260826.19" _site/ly-module-loader.js
          grep -q "ly-chat-unit-sync.js?v=20260826.8" _site/ly-module-loader.js
          grep -q "lat-yen-fresh-core-v2-authoritative-153" _site/sw.js
          grep -q "lat-yen-fresh-core-v2-authoritative-153" _site/runtime-version.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'release-config.json'
      - 'runtime-version.json'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'ly-*.js'
      - 'src-v3/**'
      - 'scripts/prepare-pages-artifact.mjs'
      - 'scripts/copy-pages-runtime.mjs'
      - 'scripts/runtime-assets.mjs'
      - 'scripts/test-ui-responsive-load-stability.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run predeploy regression gate
        run: npm run predeploy:check

      - name: Verify responsive UI and page-load stability
        run: node scripts/test-ui-responsive-load-stability.mjs

      - name: Verify critical assistant contracts
        run: |
          node scripts/test-chat-language-plus.mjs
          node scripts/test-chat-sales-query.mjs
          node scripts/test-chat-sales-insights.mjs
          node scripts/test-chat-router-sales-revenue-card.mjs
          node scripts/test-chat-response-guard.mjs
          node scripts/prepare-pages-artifact.mjs --check

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-pages-artifact.mjs
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          node scripts/copy-pages-runtime.mjs _site
          cp -R src-v2 _site/src-v2

          node scripts/check-release-consistency.mjs
          grep -q "externalAi:false" _site/ly-chat-local-only.js
          grep -q "IDBObjectStore" _site/ly-chat-response-gate.js
          test -f _site/ly-chat-router.js
          test -f _site/ly-sales-report-revenue-card.js
          test -f _site/ly-ui-stability.js
          test -f _site/ly-ui-form-ergonomics.js
          test -f _site/ly-ui-design-system.js
          test -f _site/ly-ui-sales-workflow.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

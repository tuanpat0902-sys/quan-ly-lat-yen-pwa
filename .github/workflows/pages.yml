name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  refactor_activity_history:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/activity-history-module'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/activity-history-module
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded extraction when still needed
        run: |
          if grep -Eq 'function[[:space:]]+renderHistory[[:space:]]*\(' index.html; then
            node scripts/extract-activity-history.mjs
          else
            echo "Activity History UI already extracted"
          fi

      - name: Validate refactored runtime
        run: npm run validate

      - name: Commit extracted output back to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ly-activity-history.js refactor/activity-history-extraction-result.md
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "refactor: extract Activity History UI [activity-history-extracted]"
          git push origin HEAD:refactor/activity-history-module

  validate:
    needs: [refactor_activity_history]
    if: always() && (needs.refactor_activity_history.result == 'success' || needs.refactor_activity_history.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate production runtime
        run: npm run validate

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

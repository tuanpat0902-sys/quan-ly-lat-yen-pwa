name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Pages artifact contract
        run: node scripts/prepare-pages-artifact.mjs --check

      - name: Build minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          # One authoritative assistant submit path.
          sed -E -i "s#ly-module-loader\.js\?v=[^\"']+#ly-module-loader.js?v=20260825.57#g" _site/index.html
          sed -i "s/const VERSION='2026.08.25.52';/const VERSION='2026.08.25.57';/" _site/ly-module-loader.js
          sed -i "s#ly-local-chatbot.js?v=20260825.3#ly-local-chatbot.js?v=20260825.4#" _site/ly-module-loader.js
          sed -i "s/__lyLocalAssistant?.version==='2026.08.25.3'/__lyLocalAssistant?.version==='2026.08.25.4'/" _site/ly-module-loader.js
          sed -i "s#ly-chat-unit-normalizer.js?v=20260825.4#ly-chat-unit-normalizer.js?v=20260825.8#" _site/ly-module-loader.js
          sed -i "s/__lyChatUnitNormalizer?.version==='2026.08.25.4'/__lyChatUnitNormalizer?.version==='2026.08.25.8'/" _site/ly-module-loader.js
          sed -i "s/lat-yen-fresh-core-v2-authoritative-105/lat-yen-fresh-core-v2-authoritative-110/" _site/sw.js

          python - <<'PY'
          from pathlib import Path
          import re

          # Core + single-owner submit controller load before any chatbot UI/listener.
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          block='''<script src="./ly-chat-stock-core-v5.js?v=20260825.5"></script>\n<script src="./ly-chat-submit-controller-v6.js?v=20260825.6"></script>\n'''
          if 'ly-chat-submit-controller-v6.js?v=20260825.6' not in s:
              marker='</head>'
              pos=s.lower().find(marker)
              if pos < 0:
                  raise SystemExit('Missing </head>')
              s=s[:pos]+block+s[pos:]
          # Remove all previous event-owning hotfix preloads.
          s=re.sub(r'\s*<script src="\.\/ly-chat-stock-command-normalizer-v4\.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'\s*<script src="\.\/ly-chat-stock-submit-gate\.js\?v=[^"]+"></script>','',s)
          p.write_text(s,encoding='utf-8')

          # Patch authoritative local chatbot business parser; UI events are owned by controller v6.
          p=Path('_site/ly-local-chatbot.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='2026.08.25.3';","const VERSION='2026.08.25.4';",1)
          s=s.replace("query:phrase,quantity:kind==='stocktake'?amount.quantity:(amount.quantity!==null&&amount.quantity>0?amount.quantity:null)","query:displayRequestedTerm(message,phrase),quantity:kind==='stocktake'?amount.quantity:(amount.quantity!==null&&amount.quantity>0?amount.quantity:null)")
          old="""    const item={id:option.id,name:option.name,unit:text(option.unit||clarification.unit),quantity:clarification.quantity,clarification_id:clarification.id};"""
          new="""    const converted=window.__lyChatStockCoreV5?.convertAmount?.({quantity:clarification.quantity,unit:clarification.unit},option);\n    const item={id:option.id,name:option.name,unit:text(option.unit||clarification.unit),quantity:converted?.ok?converted.quantity:clarification.quantity,clarification_id:clarification.id};"""
          if old not in s:
              raise SystemExit('Local assistant item-choice anchor changed')
          s=s.replace(old,new,1)
          old_submit="""async function submit(){
  const input=document.getElementById?.('lyAssistantInput'),content=text(input?.value);if(!content)return;
  input.value='';await retireDrafts();await addMessage({id:uid(),role:'user',content,created_at:now()});
  const reply=assistantReply(content);
  state.thinking=true;renderMessages();const answer=await askAi(content,reply.content,reply);state.thinking=false;await addMessage({id:uid(),role:'assistant',content:answer,draft:reply.draft||null,created_at:now()});
}"""
          new_submit="""async function submit(){
  const input=document.getElementById?.('lyAssistantInput'),raw=text(input?.value);if(!raw)return;
  const core=window.__lyChatStockCoreV5,prep=core?.preprocess?core.preprocess(raw):{mode:'pass',message:raw};
  if(prep.mode==='missing'||prep.mode==='invalid-unit'){
    input.value='';await retireDrafts();await addMessage({id:uid(),role:'user',content:raw,created_at:now()});
    const detail=prep.mode==='invalid-unit'?`Đơn vị ${prep.amount?.unit||''} không phù hợp với ${prep.item?.name||prep.term} đang quản lý theo ${prep.item?.unit||''}. Mình chưa tạo phiếu để tránh sai số lượng.`:`Mình không tìm thấy nguyên liệu chính xác “${prep.term||raw}” trong kho đang chọn. Mình chưa tạo phiếu để tránh chọn nhầm.`;
    await addMessage({id:uid(),role:'assistant',content:detail,created_at:now()});return;
  }
  const content=text(prep.message||raw);input.value='';await retireDrafts();await addMessage({id:uid(),role:'user',content:raw,created_at:now()});
  const reply=assistantReply(content);
  state.thinking=true;renderMessages();const answer=await askAi(content,reply.content,reply);state.thinking=false;await addMessage({id:uid(),role:'assistant',content:answer,draft:reply.draft||null,created_at:now()});
}"""
          if old_submit not in s:
              raise SystemExit('Local assistant submit anchor changed')
          s=s.replace(old_submit,new_submit,1)
          s=s.replace('grid-template-rows:auto auto 1fr auto','grid-template-rows:auto 1fr auto')
          s=re.sub(r'<div class="ly-assistant-privacy">.*?</div><div id="lyAssistantMessages"', '<div id="lyAssistantMessages"', s, count=1)
          p.write_text(s,encoding='utf-8')

          # Precache only non-event stock core + controller. Legacy guards stay out of boot.
          p=Path('_site/sw.js')
          sw=p.read_text(encoding='utf-8')
          needle="'./ly-chat-unit-normalizer.js',"
          extra="'./ly-chat-unit-normalizer.js','./ly-chat-stock-core-v5.js','./ly-chat-submit-controller-v6.js',"
          if "'./ly-chat-submit-controller-v6.js'" not in sw:
              if needle not in sw:
                  raise SystemExit('Missing chatbot asset anchor')
              sw=sw.replace(needle,extra,1)
          p.write_text(sw,encoding='utf-8')
          PY

          grep -q "ly-module-loader.js?v=20260825.57" _site/index.html
          grep -q "ly-chat-stock-core-v5.js?v=20260825.5" _site/index.html
          grep -q "ly-chat-submit-controller-v6.js?v=20260825.6" _site/index.html
          ! grep -q "ly-chat-stock-submit-gate.js" _site/index.html
          ! grep -q "ly-chat-stock-command-normalizer-v4.js" _site/index.html
          grep -q "ly-local-chatbot.js?v=20260825.4" _site/ly-module-loader.js
          grep -q "__lyLocalAssistant?.version==='2026.08.25.4'" _site/ly-module-loader.js
          grep -q "ly-chat-unit-normalizer.js?v=20260825.8" _site/ly-module-loader.js
          grep -q "const VERSION='2026.08.25.4'" _site/ly-local-chatbot.js
          grep -q "__lyChatStockCoreV5?.convertAmount" _site/ly-local-chatbot.js
          grep -q "core?.preprocess" _site/ly-local-chatbot.js
          grep -q "lat-yen-fresh-core-v2-authoritative-110" _site/sw.js
          grep -q "'./ly-chat-stock-core-v5.js'" _site/sw.js
          grep -q "'./ly-chat-submit-controller-v6.js'" _site/sw.js

          echo 'Pages artifact files:'
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

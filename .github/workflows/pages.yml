name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the release files
        run: |
          node scripts/test-chat-language-plus.mjs
          node scripts/test-chat-sales-query.mjs
          node scripts/test-chat-sales-insights.mjs
          node scripts/test-chat-router-sales-revenue-card.mjs
          node scripts/test-chat-response-guard.mjs
          node scripts/prepare-pages-artifact.mjs --check

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll runtime-version.json _site/
          find . -maxdepth 1 -type f -name 'ly-*.js' -exec cp {} _site/ \;
          cp -R src-v2 _site/src-v2

          grep -q "const VERSION='2026.08.26.19'" _site/ly-local-chatbot.js
          grep -q "const VERSION='2026.08.27.7'" _site/ly-module-loader.js
          grep -q "ly-chat-legacy-inventory-unit-guard.js?v=20260827.1" _site/ly-module-loader.js
          grep -q "ly-chat-response-gate.js?v=20260827.1" _site/ly-module-loader.js
          grep -q "const VERSION='2026.08.27.1'" _site/ly-chat-legacy-inventory-unit-guard.js
          grep -q "const VERSION='2026.08.27.1'" _site/ly-chat-response-gate.js
          grep -q "IDBObjectStore" _site/ly-chat-response-gate.js
          grep -q "ly-chat-language-plus.js?v=20260827.5" _site/ly-module-loader.js
          grep -q "const VERSION='2026.08.27.5'" _site/ly-chat-language-plus.js
          grep -q "const VERSION='2026.08.27.1'" _site/ly-chat-router.js
          grep -q "const VERSION='2026.08.27.2'" _site/ly-chat-inventory-query.js
          grep -q "const VERSION='2026.08.27.1'" _site/ly-chat-sales-query.js
          grep -q "const VERSION='2026.08.27.2'" _site/ly-chat-sales-insights.js
          grep -q "const VERSION='2026.08.27.1'" _site/ly-sales-report-revenue-card.js
          grep -q "ly-sales-report-revenue-card.js?v=20260827.1" _site/ly-special-reports-bridge.js
          grep -q "ly-app-version.js?v=2.1.69" _site/ly-module-loader.js
          grep -q "ly-notification-center.js?v=20260827.4" _site/ly-module-loader.js
          grep -q "const VERSION='2026.08.27.4'" _site/ly-notification-center.js
          grep -q "\"appVersion\": \"2.1.69\"" _site/runtime-version.json
          grep -q "externalAi:false" _site/ly-chat-local-only.js
          grep -q "lat-yen-fresh-core-v2-authoritative-159" _site/sw.js
          grep -q "ly-chat-legacy-inventory-unit-guard.js" _site/sw.js
          grep -q "ly-chat-response-gate.js" _site/sw.js
          grep -q "ly-chat-router.js" _site/sw.js
          grep -q "ly-sales-report-revenue-card.js" _site/sw.js
          grep -q "lat-yen-fresh-core-v2-authoritative-158" _site/runtime-version.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

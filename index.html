function excelSafeId(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'')
    .toLowerCase();
}

function excelImportedRecord(x){
  return x?._excel_import_batch===EXCEL_IMPORT_ID;
}

function v236ComparableIngredient(row){
  return {
    name:
      String(row?.name||'').trim(),
    unit:
      String(row?.unit||'').trim(),
    minimum_stock:
      Number(row?.minimum_stock||0),
    ingredient_type:
      String(
        row?.ingredient_type||
        'purchased'
      ),
    batch_output_qty:
      Number(row?.batch_output_qty||1),
    cost:
      Number(row?.cost||0),
    active:
      row?.active!==false
  };
}

function v236ComparableProduct(row){
  return {
    name:
      String(row?.name||'').trim(),
    sku:
      row?.sku||null,
    selling_price:
      Number(row?.selling_price||0),
    active:
      row?.active!==false
  };
}

function v236StableRecipeRows(rows){
  return (rows||[])
    .map(row=>({
      ingredient_id:
        String(row.ingredient_id||''),
      quantity:
        Number(row.quantity||0)
    }))
    .sort((a,b)=>
      a.ingredient_id.localeCompare(
        b.ingredient_id
      )
    );
}

function v236SameValue(a,b){
  return (
    JSON.stringify(a)===
    JSON.stringify(b)
  );
}

function v236QueueIngredientLatest(op){
  queueSync({
    ...op,
    kind:'save_ingredient'
  });
}

function v236RecoverMigratedExcelEdits(
  localBefore,
  cloud
){
  let ingredientRecovered=0;
  let recipeRecovered=0;

  const cloudIngredients=
    new Map(
      (cloud?.ingredients||[])
        .filter(x=>x?.id)
        .map(x=>[
          String(x.id),
          x
        ])
    );

  const cloudProducts=
    new Map(
      (cloud?.products||[])
        .filter(x=>x?.id)
        .map(x=>[
          String(x.id),
          x
        ])
    );

  const cloudRecipeByProduct=
    new Map();

  for(const row of cloud?.recipeItems||[]){
    const id=
      String(row.product_id||'');

    if(!cloudRecipeByProduct.has(id)){
      cloudRecipeByProduct.set(
        id,
        []
      );
    }

    cloudRecipeByProduct
      .get(id)
      .push(row);
  }

  for(const local of localBefore?.ingredients||[]){
    if(
      !local?._excel_import_batch ||
      !isUuidValue(local.id)
    ){
      continue;
    }

    const cloudRow=
      cloudIngredients.get(
        String(local.id)
      );

    const changed=
      !cloudRow ||
      !v236SameValue(
        v236ComparableIngredient(
          local
        ),
        v236ComparableIngredient(
          cloudRow
        )
      );

    if(!changed){
      continue;
    }

    local._sync_status='pending';
    local._local_only=true;

    const preparedLines=
      String(
        local.ingredient_type||''
      )==='prepared'
        ?(
          localBefore.preparedItems||[]
        )
          .filter(row=>
            String(
              row.prepared_ingredient_id||''
            )===
            String(local.id)
          )
          .map(row=>({
            source_ingredient_id:
              row.source_ingredient_id,
            quantity:
              Number(row.quantity||0)
          }))
        :[];

    v236QueueIngredientLatest({
      ingredient_id:
        local.id,
      payload:{
        name:local.name,
        unit:local.unit,
        minimum_stock:
          Number(
            local.minimum_stock||0
          ),
        ingredient_type:
          local.ingredient_type||
          'purchased',
        batch_output_qty:
          Number(
            local.batch_output_qty||1
          ),
        active:
          local.active!==false,
        updated_at:
          local.updated_at||
          new Date().toISOString(),
        cost:
          Number(local.cost||0)
      },
      prepared_lines:
        preparedLines
    });

    ingredientRecovered++;
  }

  for(const product of localBefore?.products||[]){
    if(
      !product?._excel_import_batch ||
      !isUuidValue(product.id)
    ){
      continue;
    }

    const localLines=
      (localBefore.recipeItems||[])
        .filter(row=>
          String(row.product_id||'')===
          String(product.id)
        );

    if(!localLines.length){
      continue;
    }

    const cloudProduct=
      cloudProducts.get(
        String(product.id)
      );

    const cloudLines=
      cloudRecipeByProduct.get(
        String(product.id)
      )||[];

    const productChanged=
      !cloudProduct ||
      !v236SameValue(
        v236ComparableProduct(
          product
        ),
        v236ComparableProduct(
          cloudProduct
        )
      );

    const recipeChanged=
      !v236SameValue(
        v236StableRecipeRows(
          localLines
        ),
        v236StableRecipeRows(
          cloudLines
        )
      );

    if(
      !productChanged &&
      !recipeChanged
    ){
      continue;
    }

    const lines=
      localLines.map(row=>({
        ingredient_id:
          row.ingredient_id,
        quantity:
          Number(row.quantity||0)
      }));

    if(
      !recipeCanSyncCloud(
        product.id,
        lines
      )
    ){
      continue;
    }

    product._sync_status='pending';
    product._local_only=true;
    delete product._recipe_local_only;

    for(const row of localLines){
      row._local_only=true;
      row._recipe_local_only=true;
    }

    queueRecipeSync({
      product_id:
        product.id,
      warehouse_id:
        currentWarehouseId,
      unit:
        product.unit||
        productUnitMap()?.[
          product.id
        ]||
        'ly',
      payload:{
        name:product.name,
        sku:product.sku||null,
        selling_price:
          Number(
            product.selling_price||0
          ),
        active:
          product.active!==false
      },
      lines
    });

    recipeRecovered++;
  }

  if(
    ingredientRecovered ||
    recipeRecovered
  ){
    cacheSave();

    console.info(
      'V236 recovered migrated Excel edits',
      {
        ingredientRecovered,
        recipeRecovered
      }
    );
  }

  return {
    ingredientRecovered,
    recipeRecovered
  };
}

function preserveExcelImportedLocal(localBefore,targetDb){
  if(!localBefore||!targetDb){
    return targetDb;
  }

  const legacyRow=(key,row)=>{
    if(!excelImportedRecord(row)){
      return false;
    }

    if(key==='warehouses'){
      return !isUuidValue(row.id);
    }

    if(key==='suppliers'){
      return !!row.id &&
        !isUuidValue(row.id);
    }

    if(key==='ingredients'){
      return !isUuidValue(row.id);
    }

    if(key==='inventory'){
      return !isUuidValue(row.warehouse_id) ||
        !isUuidValue(row.ingredient_id);
    }

    if(key==='products'){
      return !isUuidValue(row.id);
    }

    if(key==='recipeItems'){
      return !isUuidValue(row.product_id) ||
        !isUuidValue(row.ingredient_id);
    }

    if(key==='preparedItems'){
      return !isUuidValue(row.prepared_ingredient_id) ||
        !isUuidValue(row.source_ingredient_id);
    }

    if(key==='sales'){
      return !isUuidValue(row.id) ||
        !isUuidValue(row.warehouse_id);
    }

    if(key==='saleItems'){
      return !isUuidValue(row.sale_id) ||
        !isUuidValue(row.product_id);
    }

    if(key==='movements'){
      return !isUuidValue(row.warehouse_id) ||
        !isUuidValue(row.ingredient_id);
    }

    return true;
  };

  const keys=[
    'warehouses',
    'suppliers',
    'ingredients',
    'inventory',
    'products',
    'recipeItems',
    'preparedItems',
    'sales',
    'saleItems',
    'movements'
  ];

  for(const key of keys){
    const local=
      (localBefore[key]||[])
        .filter(row=>
          legacyRow(
            key,
            row
          )
        );

    if(!targetDb[key]){
      targetDb[key]=[];
    }

    for(const item of local){
      let idx=-1;

      if(key==='inventory'){
        idx=
          targetDb[key]
            .findIndex(x=>
              x.warehouse_id===
                item.warehouse_id &&
              x.ingredient_id===
                item.ingredient_id
            );
      }else{
        idx=
          targetDb[key]
            .findIndex(x=>
              x.id===item.id
            );
      }

      if(idx>=0){
        targetDb[key][idx]={
          ...targetDb[key][idx],
          ...item
        };
      }else{
        targetDb[key].push(
          item
        );
      }
    }
  }

  return targetDb;
}

function removeExistingExcelImport(){
  const keys=['warehouses','suppliers','ingredients','inventory','products','recipeItems','preparedItems','sales','saleItems','movements'];
  for(const key of keys){
    db[key]=(db[key]||[]).filter(x=>!excelImportedRecord(x));
  }

  try{
    const map=getProductWarehouseMap();
    for(const id of Object.keys(map)){
      if(String(id).startsWith('excel_prod_'))delete map[id];
    }
    saveProductWarehouseMap(map);
  }catch(e){}
}

function excelImportIngredientMaps(){
  const byCode={};
  const preparedByName={};
  for(const i of db.ingredients||[]){
    if(i.excel_code)byCode[i.excel_code]=i.id;
    if(i.ingredient_type==='prepared')preparedByName[i.name]=i.id;
  }
  return {byCode,preparedByName};
}

const CACHE_KEY='kho_do_uong_v3_cloud_cache';
const V2_KEY='kho_do_uong_v2';
const PENDING_SYNC_KEY='lat_yen_pending_sync_v1';
function getPendingSync(){try{return JSON.parse(localStorage.getItem(PENDING_SYNC_KEY)||'[]')}catch(e){return []}}

function isExcelLocalIngredient(ingredientOrId){
  const ing=
    typeof ingredientOrId==='string'
      ?(db.ingredients||[])
        .find(x=>
          x.id===ingredientOrId
        )
      :ingredientOrId;

  const id=
    String(
      ing?.id||
      ingredientOrId||
      ''
    );

  /*
    V236 FIX:
    _excel_import_batch is provenance, NOT a reason to remain local forever.
    After V198/V205 migration the row has a real Cloud UUID and must be
    editable/syncable like every other ingredient.
  */
  if(isUuidValue(id)){
    return false;
  }

  return !!(
    ing?._excel_import_batch ||
    id.startsWith('excel_ing_') ||
    id.startsWith('excel_prepared_')
  );
}

function cleanupInvalidExcelSyncQueue(){
  let changed=false;

  const queue=getPendingSync();
  const cleaned=queue.filter(op=>{
    if(op?.kind!=='save_ingredient')return true;

    const ing=(db.ingredients||[]).find(x=>x.id===op.ingredient_id);
    const isExcel=isExcelLocalIngredient(ing||op.ingredient_id);

    if(isExcel){
      changed=true;
      if(ing){
        delete ing._sync_status;
        delete ing._sync_error;
        ing._local_only=true;
      }
      return false;
    }

    return true;
  });

  // Dá»n cáº£ badge pending cÅ© ká»ƒ cáº£ khi queue Ä‘Ã£ máº¥t.
  for(const ing of db.ingredients||[]){
    if(isExcelLocalIngredient(ing) && ing._sync_status==='pending'){
      delete ing._sync_status;
      delete ing._sync_error;
      ing._local_only=true;
      changed=true;
    }
  }

  if(changed){
    setPendingSync(cleaned);
    cacheSave();
    updatePendingSyncBadge();
  }

  return changed;
}

function setPendingSync(items){localStorage.setItem(PENDING_SYNC_KEY,JSON.stringify(items||[]))}
function queueSync(op){
  let q=getPendingSync();

  /*
    V236: edits must be last-write-wins.
    Repeated ingredient edits should not leave older payloads ahead of the
    newest payload in the queue.
  */
  if(
    op?.kind==='save_ingredient' &&
    op?.ingredient_id
  ){
    q=q.filter(x=>!(
      x?.kind==='save_ingredient' &&
      String(x.ingredient_id)===
      String(op.ingredient_id)
    ));
  }

  q.push({
    ...op,
    queued_at:
      new Date().toISOString()
  });

  setPendingSync(q);
  updatePendingSyncBadge();
}
function updatePendingSyncBadge(){
  const n=getPendingSync().length;
  const el=document.getElementById('cloudStatus');
  if(el&&n>0&&!syncing)el.textContent=(cloudOnline?'Cloud':'Offline')+' â€¢ '+n+' chÆ°a Ä‘á»“ng bá»™';
}

const V233_INTERACTION_QUIET_MS=2600;
const V233_DEFERRED_RETRY_MS=500;

let v233LastInteractionAt=0;
let v233PointerDown=false;
let v233ScrollMarkAt=0;

function v233MarkInteraction(){
  v233LastInteractionAt=Date.now();
}

function v233ComboOpen(){

function v233TextEditingActive(){
  const active=
    document.activeElement;

  if(!active){
    return false;
  }

  if(
    active.matches?.(
      'textarea, [contenteditable="true"]'
    )
  ){
    return true;
  }

  if(
    active.matches?.(
      'input:not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="checkbox"]):not([type="radio"])'
    )
  ){
    return !active.readOnly;
  }

  return false;
}

function v233RecentInteraction(){
  return (
    Date.now()-v233LastInteractionAt<
    V233_INTERACTION_QUIET_MS
  );
}

function v233ScheduleDeferredFlush(
  delay=V233_DEFERRED_RETRY_MS
){
  clearTimeout(
    v219DeferredTimer
  );

  v219DeferredTimer=
    setTimeout(
      v219FlushDeferredRender,
      delay
    );
}

  delay=700
){

    cloudReloadTimer

  cloudReloadTimer=
    setTimeout(
      ()=>{
        if(v219InteractionActive()){
          cloudReloadRequested=true;
          v233ScheduleCloudReload(
            900
          );
          return;
        }

        cloudReloadRequested=false;
        loadCloud();

      delay
    );
}

function v219FlushDeferredRender(){
  clearTimeout(
    v219DeferredTimer
  );

  if(!v219DeferredRender){
    return;
  }

  if(v219InteractionActive()){
    if(v240HasActiveDraft()){
      v240MarkProjectionDeferred();
    }
    v233ScheduleDeferredFlush();
    return;
  }

  /*
    V235 first applies queued DATA while idle, then performs only one UI
    render. Realtime/canonical no longer rebuild the panel independently.
  */
  v235FlushDeferredData();

  if(v219InteractionActive()){
    v233ScheduleDeferredFlush();
    return;
  }

  v219DeferredRender=false;
  v240ClearDeferredStatus();

  try{
    renderWarehouseSelect();

    renderPanel(
      v219ActivePanel()
    );

    updatePendingSyncBadge();

  }catch(e){
    console.warn(
      'V235 deferred render',
      e
    );
  }
}

  renderWarehouseSelect();

  renderPanel(

}

    'keydown',

  document.addEventListener(

    ()=>{
      v233MarkInteraction();

      if(v219DeferredRender){
        v233ScheduleDeferredFlush();
      }
    },

  );

  document.addEventListener(

    ()=>{

  );

  document.addEventListener(
    'wheel',
    ()=>{
      v233MarkInteraction();
    },

      passive:true,

    }

  document.addEventListener(

const V220_SELECT_SEARCH_DELAY_MS=60;

function v220Norm(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/Ä‘/g,'d')
    .replace(/Ä/g,'D')
    .toLowerCase()
    .trim();
}

function v220OptionSearchText(option){
  return v220Norm(
    [
      option.textContent,
      option.value,
      option.dataset?.code,
      option.dataset?.name
    ]
      .filter(Boolean)
      .join(' ')
  );
}

function v220CreateCombo(){
  if(v220Combo)return;

  v220Combo=document.createElement('div');
  v220Combo.className='v220-combo';

  v220Combo.innerHTML=`
    <div class="v220-combo-box">
      <input
        id="v220ComboInput"
        type="text"
        autocomplete="off"
        placeholder="GÃµ Ä‘á»ƒ tÃ¬m..."
      >
      <div
        id="v220ComboList"
        class="v220-combo-list"
      ></div>
    </div>
  `;

  document.body.appendChild(
    v220Combo
  );

  v220ComboInput=
    v220Combo.querySelector(
      '#v220ComboInput'
    );

  v220ComboList=
    v220Combo.querySelector(
      '#v220ComboList'
    );

  v220ComboInput.addEventListener(
    'input',
    ()=>v220RenderComboItems(
      v220ComboInput.value
    )
  );

  v220ComboInput.addEventListener(
    'keydown',
    event=>{
      if(event.key==='ArrowDown'){
        event.preventDefault();

        v220ComboIndex=
          Math.min(
            v220ComboItems.length-1,
            v220ComboIndex+1
          );

        v220PaintComboActive();
        return;
      }

      if(event.key==='ArrowUp'){
        event.preventDefault();

        v220ComboIndex=
          Math.max(
            0,
            v220ComboIndex-1
          );

        v220PaintComboActive();
        return;
      }

      if(event.key==='Enter'){
        event.preventDefault();

        const item=
          v220ComboItems[
            v220ComboIndex
          ];

        if(item){
          v220ChooseOption(
            item.option
          );
        }

        return;
      }

      if(event.key==='Escape'){
        event.preventDefault();
        v220CloseCombo();
      }
    }
  );

  v220Combo.addEventListener(
    'mousedown',
    event=>{
      if(event.target===v220Combo){
        event.preventDefault();
        v220CloseCombo();
      }
    }
  );
}

function v220PositionCombo(select){
  const rect=
    select.getBoundingClientRect();

  const width=
    Math.max(
      260,
      Math.min(
        560,
        rect.width
      )
    );

  const left=
    Math.max(
      8,
      Math.min(
        window.innerWidth-width-8,
        rect.left
      )
    );

  const top=
    Math.min(
      window.innerHeight-260,
      rect.bottom+4
    );

  const box=
    v220Combo.querySelector(
      '.v220-combo-box'
    );

  box.style.width=
    width+'px';

  box.style.left=
    left+'px';

  box.style.top=
    Math.max(
      8,
      top
    )+'px';
}

/* ===== V234 SMART DROPDOWN AUTO CLOSE ===== */
const V234_COMBO_IDLE_MS=8000;

let v234ComboIdleTimer=null;
let v234ClosingCombo=false;

function v234ComboIsOpen(){
  return !!(
    v220Combo?.classList.contains(
      'open'
    )
  );
}

function v234ResetComboIdle(){
  clearTimeout(
    v234ComboIdleTimer
  );

  if(!v234ComboIsOpen()){
    return;
  }

  v234ComboIdleTimer=
    setTimeout(
      ()=>{
        if(!v234ComboIsOpen()){
          return;
        }

        v220CloseCombo({
          restoreFocus:false,
          reason:'idle'
        });
      },
      V234_COMBO_IDLE_MS
    );
}

function v234ComboContains(target){
  return !!(
    target &&
    v220Combo?.contains(
      target
    )
  );
}

function v234IsCurrentSelect(target){
  return !!(
    target &&
    v220ComboSelect &&
    (
      target===v220ComboSelect ||
      target.closest?.('select')===
        v220ComboSelect
    )
  );
}

function v234CloseComboIfOutside(
  target
){
  if(
    !v234ComboIsOpen() ||
    v234ClosingCombo
  ){
    return;
  }

  if(
    v234ComboContains(target) ||
    v234IsCurrentSelect(target)
  ){
    v234ResetComboIdle();
    return;
  }

  v220CloseCombo({
    restoreFocus:false,
    reason:'outside'
  });
}

function v234InstallComboAutoClose(){
  /*
    pointerdown runs before most controls change focus,
    so the old dropdown disappears before the next UI action.
  */
  document.addEventListener(
    'pointerdown',
    event=>{
      v234CloseComboIfOutside(
        event.target
      );
    },
    true
  );

  document.addEventListener(
    'focusin',
    event=>{
      if(
        !v234ComboIsOpen()
      ){
        return;
      }

      if(
        v234ComboContains(
          event.target
        ) ||
        v234IsCurrentSelect(
          event.target
        )
      ){
        v234ResetComboIdle();
        return;
      }

      v220CloseCombo({
        restoreFocus:false,
        reason:'focus_elsewhere'
      });
    },
    true
  );

  document.addEventListener(
    'keydown',
    event=>{
      if(!v234ComboIsOpen()){
        return;
      }

      if(
        v234ComboContains(
          event.target
        ) ||
        v234IsCurrentSelect(
          event.target
        )
      ){
        v234ResetComboIdle();
      }
    },
    true
  );

  document.addEventListener(
    'input',
    event=>{
      if(
        v234ComboIsOpen() &&
        v234ComboContains(
          event.target
        )
      ){
        v234ResetComboIdle();
      }
    },
    true
  );

  document.addEventListener(
    'wheel',
    event=>{
      if(
        !v234ComboIsOpen()
      ){
        return;
      }

      if(
        v234ComboContains(
          event.target
        )
      ){
        v234ResetComboIdle();
        return;
      }

      v220CloseCombo({
        restoreFocus:false,
        reason:'outside_scroll'
      });
    },
    {
      passive:true,
      capture:true
    }
  );

  window.addEventListener(
    'blur',
    ()=>{
      if(v234ComboIsOpen()){
        v220CloseCombo({
          restoreFocus:false,
          reason:'window_blur'
        });
      }
    }
  );

  document.addEventListener(
    'visibilitychange',
    ()=>{
      if(
        document.hidden &&
        v234ComboIsOpen()
      ){
        v220CloseCombo({
          restoreFocus:false,
          reason:'hidden'
        });
      }
    }
  );
}

function v220OpenCombo(
  select,
  initialText=''
){
  if(
    !select ||
    select.disabled ||
    select.multiple ||
    select.size>1
  ){
    return;
  }

  v220CreateCombo();

  /*
    Opening another select simply retargets the existing searchable
    dropdown instead of forcing the previous value to be selected.
  */
  v220ComboSelect=
    select;

  v220PositionCombo(
    select
  );

  v220Combo.classList.add(
    'open'
  );

  v220ComboInput.value=
    String(
      initialText||''
    );

  v220RenderComboItems(
    v220ComboInput.value
  );

  v234ResetComboIdle();

  setTimeout(
    ()=>{
      if(
        v220ComboSelect!==select ||
        !v234ComboIsOpen()
      ){
        return;
      }

      v220ComboInput.focus();
      v220ComboInput.select();
    },
    0
  );
}

function v220CloseCombo(
  options={}
){
  if(!v220Combo)return;

  const {
    restoreFocus=true
  }=options||{};

  const wasOpen=
    v220Combo.classList.contains(
      'open'
    );

  const select=
    v220ComboSelect;

  v234ClosingCombo=true;

  clearTimeout(
    v234ComboIdleTimer
  );

  v220Combo.classList.remove(
    'open'
  );

  v220ComboSelect=null;
  v220ComboItems=[];
  v220ComboIndex=0;

  v234ClosingCombo=false;

  if(
    wasOpen &&
    restoreFocus &&
    select &&
    document.contains(select)
  ){
    setTimeout(
      ()=>{
        /*
          Do not steal focus back if the user already moved to a
          different control.
        */
        const active=
          document.activeElement;

        if(
          active &&
          active!==document.body &&
          active!==v220ComboInput
        ){
          return;
        }

        try{
          select.focus({
            preventScroll:true
          });
        }catch(e){}
      },
      0
    );
  }

  if(
    wasOpen &&
    v219DeferredRender
  ){
    v233ScheduleDeferredFlush(
      250
    );
  }
}

function v220RenderComboItems(query=''){
  const select=
    v220ComboSelect;

  if(!select)return;

  const needle=
    v220Norm(query);

  const all=
    [...select.options]
      .map((option,index)=>({
        option,
        index,
        text:
          String(
            option.textContent||''
          ),
        search:
          v220OptionSearchText(
            option
          )
      }));

  let matches=
    needle
      ?all.filter(x=>
          x.search.includes(
            needle
          )
        )
      :all;

  matches.sort((a,b)=>{
    const aStart=needle&&a.search.startsWith(needle)?0:1;
    const bStart=needle&&b.search.startsWith(needle)?0:1;
    return aStart-bStart||v221RecentRank(select,a.option)-v221RecentRank(select,b.option)||a.index-b.index;
  });

  v220ComboItems=
    matches.slice(
      0,
      80
    );

  v220ComboIndex=0;

  v220ComboList.innerHTML=
    v220ComboItems.length
      ?v220ComboItems
          .map(
            (item,index)=>`
              <button
                type="button"
                class="v220-combo-item ${index===0?'active':''}"
                data-index="${index}"
              >
                ${esc(item.text)}
              </button>
            `
          )
          .join('')
      :`<div class="v220-combo-empty">KhÃ´ng tÃ¬m tháº¥y</div>`;

  for(
    const btn of
    v220ComboList
      .querySelectorAll(
        '.v220-combo-item'
      )
  ){
    btn.addEventListener(
      'mousedown',
      event=>{
        event.preventDefault();

        const index=
          Number(
            btn.dataset.index||0
          );

        const item=
          v220ComboItems[index];

        if(item){
          v220ChooseOption(
            item.option
          );
        }
      }
    );
  }
}

function v220PaintComboActive(){
  const buttons=
    [
      ...v220ComboList
        .querySelectorAll(
          '.v220-combo-item'
        )
    ];

  buttons.forEach(
    (button,index)=>{
      button.classList.toggle(
        'active',
        index===v220ComboIndex
      );
    }
  );

  buttons[
    v220ComboIndex
  ]?.scrollIntoView({
    block:'nearest'
  });
}

function v220ChooseOption(option){
  const select=
    v220ComboSelect;

  if(
    !select ||
    !option
  ){
    return;
  }

  const previous=
    select.value;

  select.value=
    option.value;

  v221RememberSelect(
    select,
    option.value
  );

  v220CloseCombo({
    restoreFocus:true,
    reason:'selected'
  });

  if(
    previous!==select.value
  ){
    select.dispatchEvent(
      new Event(
        'change',
        {
          bubbles:true
        }
      )
    );
  }
}

function v220InstallSelectTyping(){
  const eligible=select=>(
    !!select &&
    !select.disabled &&
    !select.multiple &&
    Number(select.size||0)<=1
  );

  const openFromPointer=event=>{
    const select=
      event.target?.closest?.(
        'select'
      );

    if(!eligible(select)){
      return;
    }

    event.preventDefault();

    /*
      Same select toggles closed; another select retargets immediately.
      This makes the control feel like a normal dropdown.
    */
    if(
      v234ComboIsOpen() &&
      v220ComboSelect===select
    ){
      v220CloseCombo({
        restoreFocus:false,
        reason:'toggle'
      });

      return;
    }

    v220OpenCombo(
      select,
      ''
    );
  };

  document.addEventListener(
    'pointerdown',
    openFromPointer,
    true
  );

  document.addEventListener(
    'mousedown',
    event=>{
      if(
        typeof PointerEvent!=='undefined'
      ){
        return;
      }

      openFromPointer(
        event
      );
    },
    true
  );

  document.addEventListener(
    'click',
    event=>{
      const select=
        event.target?.closest?.(
          'select'
        );

      if(
        eligible(select) &&
        v234ComboIsOpen()
      ){
        event.preventDefault();
      }
    },
    true
  );

  document.addEventListener(
    'keydown',
    event=>{
      const select=
        event.target?.closest?.(
          'select'
        );

      if(!eligible(select)){
        return;
      }

      if(
        event.ctrlKey ||
        event.metaKey ||
        event.altKey
      ){
        return;
      }

      if(
        event.key==='Enter' ||
        event.key==='F2' ||
        event.key==='ArrowDown'
      ){
        event.preventDefault();

        v220OpenCombo(
          select,
          ''
        );

        return;
      }

      if(
        event.key.length===1 &&
        !/\s/.test(event.key)
      ){
        event.preventDefault();

        v220OpenCombo(
          select,
          event.key
        );
      }
    },
    true
  );

  window.addEventListener(
    'resize',
    ()=>{
      if(
        v234ComboIsOpen() &&
        v220ComboSelect
      ){
        v220PositionCombo(
          v220ComboSelect
        );
      }
    }
  );

  window.addEventListener(
    'scroll',
    event=>{
      if(
        !v234ComboIsOpen()
      ){
        return;
      }

      if(
        event.target &&
        v234ComboContains(
          event.target
        )
      ){
        return;
      }

      /*
        Page/table moved away from the select: close instead of keeping
        a floating dropdown detached from its original field.
      */
      v220CloseCombo({
        restoreFocus:false,
        reason:'page_scroll'
      });
    },
    {
      passive:true,
      capture:true
    }
  );
}

function v220CachedOptions(
  key,
  rows,
  valueFn,
  labelFn
){
  const safeRows=
    Array.isArray(rows)
      ?rows
      :[];

  const signature=
    safeRows
      .map(row=>
        [
          valueFn(row),
          labelFn(row)
        ].join(':')
      )
      .join('|');

  const cached=
    v220OptionHtmlCache.get(
      key
    );

  if(
    cached &&
    cached.signature===signature
  ){
    return cached.html;
  }

  const html=
    safeRows
      .map(row=>
        `<option value="${esc(valueFn(row))}">${esc(labelFn(row))}</option>`
      )
      .join('');

  v220OptionHtmlCache.set(
    key,
    {
      signature,
      html
    }
  );

  return html;
}

/* ===== V224 APP ZOOM LOCK ===== */
function v224IsAppMode(){
  return (
    window.matchMedia?.('(display-mode: standalone)')?.matches ||
    window.matchMedia?.('(display-mode: fullscreen)')?.matches ||
    navigator.standalone===true ||
    /(^|\s)--app(=|\s|$)/i.test(
      String(
        window?.chrome?.app?.isInstalled||
        ''
      )
    )
  );
}

function v224InstallZoomLock(){
  const appMode=
    v224IsAppMode();

  if(!appMode){
    return;
  }

  document.documentElement.classList.add(
    'v224-app-mode'
  );

  // Ctrl/Cmd +/-/0
  document.addEventListener(
    'keydown',
    event=>{
      if(
        (event.ctrlKey||event.metaKey) &&
        (
          event.key==='+' ||
          event.key==='=' ||
          event.key==='-' ||
          event.key==='0'
        )
      ){
        event.preventDefault();
        event.stopPropagation();
      }
    },
    true
  );

  // Ctrl/Cmd + mouse wheel zoom.
  document.addEventListener(
    'wheel',
    event=>{
      if(event.ctrlKey||event.metaKey){
        event.preventDefault();
      }
    },
    {
      passive:false,
      capture:true
    }
  );

  // Safari/iOS gesture events where available.
  for(
    const name of
    [
      'gesturestart',
      'gesturechange',
      'gestureend'
    ]
  ){
    document.addEventListener(
      name,
      event=>{
        event.preventDefault();
      },
      {
        passive:false,
        capture:true
      }
    );
  }

  // Prevent rapid double-tap zoom while still allowing normal taps.
  let lastTouchEnd=0;

  document.addEventListener(
    'touchend',
    event=>{
      const now=Date.now();

      if(
        now-lastTouchEnd<=300
      ){
        event.preventDefault();
      }

      lastTouchEnd=now;
    },
    {
      passive:false,
      capture:true
    }
  );
}

/* ===== V210 DEVICE LOOP CIRCUIT BREAKER ===== */
const V210_TAB_ID=
  (
    crypto?.randomUUID?.() ||
    `${Date.now()}-${Math.random()}`
  );

const V210_LEADER_KEY='lat_yen_sync_leader_v210';
const V210_LEADER_TTL_MS=7000;
const V210_LEADER_HEARTBEAT_MS=2500;

const V210_LOOP_WINDOW_MS=12000;
const V210_LOOP_MAX_RUNS=5;
const V210_LOOP_COOLDOWN_MS=30000;

let v210LeaderTimer=null;
let v210IsLeader=false;
let v210SyncRuns=[];
let v210CircuitOpenUntil=0;
let v210Channel=null;

function v210Now(){
  return Date.now();
}

function v210ReadLeader(){
  try{
    return JSON.parse(
      localStorage.getItem(V210_LEADER_KEY)||'null'
    );
  }catch(e){
    return null;
  }
}

function v210LeaderExpired(info){
  return (
    !info ||
    !Number(info.at) ||
    v210Now()-Number(info.at)>V210_LEADER_TTL_MS
  );
}

function v210ClaimLeadership(){
  const current=v210ReadLeader();

  if(
    v210LeaderExpired(current) ||
    current?.id===V210_TAB_ID
  ){
    localStorage.setItem(
      V210_LEADER_KEY,
      JSON.stringify({
        id:V210_TAB_ID,
        at:v210Now()
      })
    );

    v210IsLeader=true;
    return true;
  }

  v210IsLeader=false;
  return false;
}

function v210Heartbeat(){
  if(document.hidden){
    if(v210IsLeader){
      const current=v210ReadLeader();

      if(current?.id===V210_TAB_ID){
        localStorage.removeItem(
          V210_LEADER_KEY
        );
      }
    }

    v210IsLeader=false;
    return;
  }

  v210ClaimLeadership();
}

function v210InitLeaderElection(){
  if('BroadcastChannel' in window){
    try{
      v210Channel=
        new BroadcastChannel(
          'lat-yen-sync-v210'
        );

      v210Channel.onmessage=
        event=>{
          if(
            event?.data?.type===
              'remote-data-updated'
          ){
            // Followers only refresh active UI from local cache.
            if(!v210IsLeader){
              v218FollowerRefresh();
            }
          }
        };
    }catch(e){}
  }

  v210Heartbeat();

  clearInterval(v210LeaderTimer);

  v210LeaderTimer=
    setInterval(
      v210Heartbeat,
      V210_LEADER_HEARTBEAT_MS
    );

  window.addEventListener(
    'storage',
    event=>{
      if(event.key===V210_LEADER_KEY){
        v210Heartbeat();
      }
    }
  );

  document.addEventListener(
    'visibilitychange',
    ()=>{
      v210Heartbeat();

      if(
        !document.hidden &&
        v210IsLeader
      ){
        scheduleNextAutoSyncV203(1000);
      }
    }
  );

  window.addEventListener(
    'beforeunload',
    ()=>{
      const current=v210ReadLeader();

      if(current?.id===V210_TAB_ID){
        localStorage.removeItem(
          V210_LEADER_KEY
        );
      }

      try{
        v210Channel?.close();
      }catch(e){}
    }
  );
}

function v210CanOwnSync(){
  /*
    V244 cross-tab lock: while Reset Cloud is running, every normal sync
    path on this browser origin must stand down.

  if(v244ResetLockActive()){

function v210CircuitAllowsSync(reason='sync'){
  const now=v210Now();

  if(now<v210CircuitOpenUntil){
    return false;
  }

  v210SyncRuns=
    v210SyncRuns.filter(
      ts=>
        now-ts<=V210_LOOP_WINDOW_MS
    );

  v210SyncRuns.push(now);

  if(
    v210SyncRuns.length>
      V210_LOOP_MAX_RUNS
  ){
    v210CircuitOpenUntil=
      now+V210_LOOP_COOLDOWN_MS;

    v210SyncRuns=[];

    console.warn(
      'V210 circuit breaker opened',
      reason
    );

    setCloudStatus(
      'Táº¡m dá»«ng sync chá»‘ng vÃ²ng láº·p',
      'offline'
    );

    return false;
  }

  return true;
}

function v210ResetCircuitAfterUserAction(){
  if(
    v210CircuitOpenUntil &&
    v210Now()>=v210CircuitOpenUntil

/* ===== V235 NON-BLOCKING SYNC ENGINE ===== */
const V235_IDLE_RECONCILE_DELAY_MS=900;
const V235_REALTIME_QUEUE_MAX=500;

let v235PushOnlyMode=false;
let v235NeedFullReconcile=false;
let v235IdleReconcileTimer=null;

let v235BatchRemoteApply=false;
let v235DeferCloudApply=false;
let v235CloudApplyDeferred=false;

let v235DeferredCanonicalMerge=null;
let v235BatchApplyDepth=0;

const v235RealtimeQueue=new Map();

function v235InputPending(){
  try{
    return !!(
      navigator.scheduling?.isInputPending?.({
        includeContinuous:true
      })
    );
  }catch(e){
    return false;
  }
}

function v235CanApplyRemote(){
  return !(
    v219InteractionActive() ||
    v235InputPending()
  );
}

function v235RealtimeKey(
  table,
  payload
){
  const row=
    payload?.new||
    payload?.old||
    payload?.record||
    {};

  const id=
    row.id||
    (
      table==='inventory'
        ?`${row.warehouse_id||''}:${row.ingredient_id||''}`
        :''
    );

  return (
    id
      ?`${table}|${id}`
      :`${table}|${Date.now()}|${Math.random()}`
  );
}

function v235QueueRealtime(
  table,
  payload
){
  const key=
    v235RealtimeKey(
      table,
      payload
    );

  // Last event for the same row wins.
  if(v235RealtimeQueue.has(key)){
    v235RealtimeQueue.delete(key);
  }

  v235RealtimeQueue.set(
    key,
    {
      table,
      payload,
      at:Date.now()
    }
  );

  while(
    v235RealtimeQueue.size>
    V235_REALTIME_QUEUE_MAX
  ){
    const oldest=
      v235RealtimeQueue
        .keys()
        .next()
        .value;

    v235RealtimeQueue.delete(
      oldest
    );

    // Queue overflow should be healed by a full pull later.
    v235NeedFullReconcile=true;
  }

  v219DeferredRender=true;
  v233ScheduleDeferredFlush();
}

function v235ApplyOrStageCanonical(
  result
){
  if(!result?.merged){
    return {
      changedKeys:0,
      conflicts:0,
      deferred:false
    };
  }

  if(
    v235BatchRemoteApply ||
    !v235CanApplyRemote()
  ){
    if(v235DeferredCanonicalMerge){
      const prior={
        schema:189,
        state:
          v235DeferredCanonicalMerge
            .merged
      };

      const next={
        schema:189,
        state:
          result.merged
      };

      const merged=
        mergeConcurrentStates([
          prior,
          next
        ]);

      merged.conflicts=[
        ...(
          v235DeferredCanonicalMerge
            .conflicts||[]
        ),
        ...(result.conflicts||[]),
        ...(merged.conflicts||[])
      ];

      v235DeferredCanonicalMerge=
        merged;
    }else{
      v235DeferredCanonicalMerge=
        result;
    }

    v219DeferredRender=true;
    v233ScheduleDeferredFlush();

    return {
      changedKeys:0,
      conflicts:
        result?.conflicts?.length||0,
      deferred:true
    };
  }

  return {
    ...applyConcurrentMergedState(
      result
    ),
    deferred:false
  };
}

function v235FlushCanonical(){
  if(
    !v235DeferredCanonicalMerge ||
    !v235CanApplyRemote()
  ){
    return 0;
  }

  /*
    Re-merge with CURRENT local state.
    This is critical: the user may have edited data after the canonical
    snapshot was received but before it became safe to apply.
  */
  const current=
    prepareConcurrentLocalState();

  const staged={
    schema:189,
    device_id:'cloud',
    device_name:'Cloud',
    updated_at:
      new Date().toISOString(),
    state:
      v235DeferredCanonicalMerge
        .merged
  };

  const merged=
    mergeConcurrentStates([
      staged,
      current
    ]);

  merged.conflicts=[
    ...(
      v235DeferredCanonicalMerge
        .conflicts||[]
    ),
    ...(merged.conflicts||[])
  ];

  v235DeferredCanonicalMerge=null;

  v235BatchApplyDepth++;

  try{
    const applied=
      applyConcurrentMergedState(
        merged
      );

    return Number(
      applied?.changedKeys||0
    );
  }finally{
    v235BatchApplyDepth=
      Math.max(
        0,
        v235BatchApplyDepth-1
      );
  }
}

function v235FlushRealtime(){
  if(
    !v235RealtimeQueue.size ||
    !v235CanApplyRemote()
  ){
    return {
      applied:0,
      critical:false
    };
  }

  const rows=[
    ...v235RealtimeQueue.values()
  ];

  v235RealtimeQueue.clear();

  let applied=0;
  let critical=false;

  v235BatchApplyDepth++;

  try{
    for(const item of rows){
      const ok=
        v207ApplyRealtimeRow(
          item.table,
          item.payload
        );

      if(ok){
        applied++;
      }else{
        v235NeedFullReconcile=true;
      }

      if(
        item.table==='sales' ||
        item.table==='sale_items' ||
        item.table==='stock_transactions' ||
        item.table==='inventory'
      ){
        critical=true;
      }
    }
  }finally{
    v235BatchApplyDepth=
      Math.max(
        0,
        v235BatchApplyDepth-1
      );
  }

  if(applied){
    cloudOnline=true;

    setCloudStatus(
      'Realtime â€¢ Ä‘Ã£ Ã¡p dá»¥ng thay Ä‘á»•i ná»n',
      'online'
    );

    v210NotifyFollowers();
  }

  return {
    applied,
    critical
  };
}

  const canonicalChanged=

async function v208FlushActionSync(){

    v208ActionSyncTimer

  v208ActionSyncTimer=null;

    !v208ActionSyncQueued ||
    !navigator.onLine

    !v210CircuitAllowsSync(
      'action:'+

    autoSyncBusy ||
    syncing ||
    v206RealtimePullBusy ||
    v208IsRemoteOrInternal()
  ){
    if(
      v209FollowupCount<
      V209_MAX_FOLLOWUP

      v209FollowupCount++;

      v208ActionSyncTimer=
        setTimeout(
          ()=>v208FlushActionSync(),
          V208_ACTION_SYNC_RETRY_MS

  }

  v208ActionSyncQueued=false;
  v209FollowupCount=0;
  v209LastActionSyncAt=Date.now();

  v208InternalWriteDepth++;

    /*
      Immediately after Save/Delete the user is normally still operating.
      Push the pending transaction now, but do NOT pull/merge/rebuild.

      v219InteractionActive() ||
      v235InputPending()

    v208InternalWriteDepth=
      Math.max(

function installV208StorageSyncHook(){

  const originalSetItem=
    Storage.prototype.setItem;

  Storage.prototype.setItem=
    function(key,value){
      const oldValue=
        this.getItem(key);

      const result=
        originalSetItem.call(
          this,
          key,
          value
        );

      if(
        this===localStorage &&
        oldValue!==String(value) &&
        v208BusinessStorageKey(key) &&
        !v208IsRemoteOrInternal() &&
        !autoSyncBusy &&
        !syncing &&
        !v206RealtimePullBusy

    };

function v218EmergencySnapshotMaybe(
  reason='before_cloud_pull'
){
  const now=Date.now();

  // When local data is still unresolved, always keep full safety snapshots.
  if(!v218SystemIsClean()){
    const ok=
      v204EmergencySnapshot(reason);

    if(ok){
      v218LastEmergencySnapshotAt=now;
    }

    return ok;
  }

  // Clean/fully-cloud state: avoid serializing the whole DB on every realtime pull.
  if(
    now-v218LastEmergencySnapshotAt<
    V218_SNAPSHOT_MIN_GAP_MS
  ){
    return true;
  }

  const ok=
    v204EmergencySnapshot(reason);

  if(ok){
    v218LastEmergencySnapshotAt=now;
  }

  return ok;
}

const runtimeIdleTasks=new Map();

function scheduleIdleWork(key,fn,timeout=500){
  const old=runtimeIdleTasks.get(key);

  if(old){
    if(old.kind==='idle' && 'cancelIdleCallback' in window){
      cancelIdleCallback(old.id);
    }else{
      clearTimeout(old.id);
    }
  }

  const run=()=>{
    runtimeIdleTasks.delete(key);

    try{
      fn();
    }catch(e){
      console.warn('Idle task error:',key,e);
    }
  };

  if('requestIdleCallback' in window){
    const id=requestIdleCallback(run,{timeout});
    runtimeIdleTasks.set(key,{kind:'idle',id});
  }else{
    const id=setTimeout(run,Math.min(80,Math.max(20,timeout/5)));
    runtimeIdleTasks.set(key,{kind:'timeout',id});
  }
}

function v252WarehouseCreatedMs(w){

}

function v252ProductFirstSeenMs(product){
  const direct=Date.parse(product?.created_at||product?.updated_at||'');
  if(Number.isFinite(direct))return direct;

  let best=Infinity;
  for(const row of db.recipeItems||[]){
    if(String(row.product_id||'')!==String(product?.id||''))continue;
    const t=Date.parse(row.created_at||row.updated_at||'');
    if(Number.isFinite(t))best=Math.min(best,t);
  }
  return Number.isFinite(best)?best:0;
}

function v252OldestWarehouseId(){
  const rows=[...(db.warehouses||[])].filter(x=>x?.id);
  rows.sort((a,b)=>{
    const at=v252WarehouseCreatedMs(a), bt=v252WarehouseCreatedMs(b);
    if(at&&bt&&at!==bt)return at-bt;
    if(at&&!bt)return -1;
    if(!at&&bt)return 1;
    return String(a.id).localeCompare(String(b.id));
  });
  return rows[0]?.id||'';
}

function v252WarehouseBusinessActivity(warehouseId){
  let sales=0,movements=0,nonZeroInventory=0;
  for(const s of db.sales||[]){
    if(String(s.warehouse_id||'')===String(warehouseId))sales++;
  }
  for(const m of db.movements||[]){
    if(
      m?._stocktake_audit_only!==true &&
      String(m.warehouse_id||'')===String(warehouseId)
    )movements++;
  }
  for(const inv of db.inventory||[]){
    if(
      String(inv.warehouse_id||'')===String(warehouseId) &&
      Math.abs(Number(inv.quantity||0))>1e-9
    )nonZeroInventory++;
  }
  return {sales,movements,nonZeroInventory,empty:sales===0&&movements===0&&nonZeroInventory===0};
}

function v252ProductSaleWarehouses(productId){
  const saleById=new Map((db.sales||[]).map(s=>[String(s.id||''),s]));
  const counts=new Map();
  for(const item of db.saleItems||[]){
    if(String(item.product_id||'')!==String(productId||''))continue;
    const sale=saleById.get(String(item.sale_id||''));
    const wid=String(sale?.warehouse_id||'');
    if(!wid)continue;
    counts.set(wid,Number(counts.get(wid)||0)+1);

  return [...counts.entries()].sort((a,b)=>b[1]-a[1]);

function v252SealUnmappedProductsToWarehouse(warehouseId){
  if(!warehouseId)return 0;
  const map=getProductWarehouseMap();
  let changed=0;
  for(const p of db.products||[]){
    if(map[p.id])continue;
    if(isProductDeletedHere(p.id,warehouseId))continue;
    map[p.id]=warehouseId;
    changed++;
  }
  if(changed)saveProductWarehouseMap(map);
  return changed;
}

function v252RepairProductWarehouseScope(){
  const map=getProductWarehouseMap();
  const valid=new Set((db.warehouses||[]).map(w=>String(w.id||'')));
  const home=v252OldestWarehouseId();
  let assigned=0,moved=0,removed=0;

  for(const p of db.products||[]){
    const old=String(map[p.id]||'');
    const history=v252ProductSaleWarehouses(p.id);
    let target='';

    if(history.length===1){
      target=history[0][0];
    }else if(history.length>1){
      if(old&&history.some(x=>x[0]===old))target=old;
      else target=history[0][0];
    }else if(old&&valid.has(old)){
      target=old;

      const w=(db.warehouses||[]).find(x=>String(x.id)===old);
      const wMs=v252WarehouseCreatedMs(w);
      const pMs=v252ProductFirstSeenMs(p);
      const activity=v252WarehouseBusinessActivity(old);

      // Old product + newer pristine warehouse + no sale evidence = old auto-claim bug.
      if(
        old!==home && activity.empty && wMs>0 && pMs>0 && pMs<wMs-1000
      ){
        target=home;
      }
    }else{
      target=home;
    }

    if(!target||!valid.has(String(target))){
      if(old){delete map[p.id];removed++;}
      continue;
    }

    if(!old)assigned++;
    else if(old!==String(target))moved++;
    map[p.id]=String(target);
  }

  // Remove ownership for products that no longer exist.
  const productIds=new Set((db.products||[]).map(p=>String(p.id||'')));
  for(const pid of Object.keys(map)){
    if(!productIds.has(String(pid))){delete map[pid];removed++;}
  }

  saveProductWarehouseMap(map);
  const report={at:new Date().toISOString(),home,assigned,moved,removed};
  try{localStorage.setItem(V252_SCOPE_REPORT_KEY,JSON.stringify(report))}catch(e){}
  return report;
}

function v256Utf8Bytes(value){
  try{
    return new TextEncoder()
      .encode(
        JSON.stringify(value??null)
      )
      .byteLength;
  }catch(e){
    return 0;
  }
}

function v256MeasureCloudUsage(snapshot){
  const tables=v256SnapshotRows(snapshot);

  const byTable={};
  let bytes=0;
  let records=0;

  for(const [table,rows] of Object.entries(tables)){
    const tableBytes=v256Utf8Bytes(rows);
    byTable[table]={
      records:(rows||[]).length,
      bytes:tableBytes
    };
    bytes+=tableBytes;
    records+=(rows||[]).length;
  }

  /*
    JSON payload size is a conservative client-visible estimate, not physical
    PostgreSQL disk size. Use a 1.35 overhead factor for indexes/row metadata.
  */
  const estimatedDbBytes=
    Math.ceil(bytes*1.35);

  const quotaBytes=
    v256CloudQuotaMb()*
    1024*1024;

  const percent=
    quotaBytes>0
      ?Math.min(
          100,
          estimatedDbBytes/
          quotaBytes*100
        )
      :0;

  return {
    at:new Date().toISOString(),
    records,
    payload_bytes:bytes,
    estimated_db_bytes:estimatedDbBytes,
    quota_mb:v256CloudQuotaMb(),
    percent,
    by_table:byTable,
    method:'client_json_x_1_35'
  };
}

function v256HumanBytes(bytes){
  const n=Number(bytes||0);

  if(n<1024)return `${Math.round(n)} B`;
  if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;
  if(n<1024*1024*1024)return `${(n/1024/1024).toFixed(2)} MB`;

  return `${(n/1024/1024/1024).toFixed(2)} GB`;
}

  if(

function v252ExactPendingMatch(type,local,cloud){
  if(!cloud)return false;
  if(type==='warehouse')return v252Same(
    {name:String(local.name||'').trim(),address:String(local.address||'').trim(),active:local.active!==false},
    {name:String(cloud.name||'').trim(),address:String(cloud.address||'').trim(),active:cloud.active!==false}
  );
  if(type==='supplier')return v252Same(
    {name:String(local.name||'').trim(),phone:String(local.phone||'').trim(),address:String(local.address||'').trim(),note:String(local.note||'').trim()},
    {name:String(cloud.name||'').trim(),phone:String(cloud.phone||'').trim(),address:String(cloud.address||'').trim(),note:String(cloud.note||'').trim()}
  );
  if(type==='ingredient')return v252Same(v236ComparableIngredient(local),v236ComparableIngredient(cloud));
  if(type==='product')return v252Same(v236ComparableProduct(local),v236ComparableProduct(cloud));
  if(type==='inventory')return Math.abs(Number(local.quantity||0)-Number(cloud.quantity||0))<=1e-9;
  if(type==='recipe_item')return (
    String(local.product_id||'')===String(cloud.product_id||'') &&
    String(local.ingredient_id||'')===String(cloud.ingredient_id||'') &&
    v228NormNumber(local.quantity)===v228NormNumber(cloud.quantity)
  );
  if(type==='prepared_item')return (
    String(local.prepared_ingredient_id||'')===String(cloud.prepared_ingredient_id||'') &&
    String(local.source_ingredient_id||'')===String(cloud.source_ingredient_id||'') &&
    v228NormNumber(local.quantity)===v228NormNumber(cloud.quantity)
  );
  if(type==='sale')return (
    String(local.warehouse_id||'')===String(cloud.warehouse_id||'') &&
    v228NormNumber(local.total_amount)===v228NormNumber(cloud.total_amount) &&
    String(local.source||'')===String(cloud.source||'') &&
    v228NormTime(local.sold_at||local.created_at)===v228NormTime(cloud.sold_at||cloud.created_at)
  );
  if(type==='sale_item')return (
    String(local.sale_id||'')===String(cloud.sale_id||'') &&
    String(local.product_id||'')===String(cloud.product_id||'') &&
    v228NormNumber(local.quantity)===v228NormNumber(cloud.quantity) &&
    v228NormNumber(local.unit_price)===v228NormNumber(cloud.unit_price)
  );
  if(type==='movement')return (
    String(normalizeTransactionTypeV200(local.transaction_type)||local.transaction_type||'')===String(normalizeTransactionTypeV200(cloud.transaction_type)||cloud.transaction_type||'') &&
    String(local.warehouse_id||'')===String(cloud.warehouse_id||'') &&
    String(local.ingredient_id||'')===String(cloud.ingredient_id||'') &&
    String(local.reference_id||'')===String(cloud.reference_id||'') &&
    v228NormNumber(local.quantity)===v228NormNumber(cloud.quantity)
  );
  return false;
}

async function v252ExactAckPending(){
  const before=v191PendingCount();
  if(before===0)return {before:0,after:0,ackedRows:0,ackedQueue:0};

  const cloud=await v252FetchExactCloud();
  const byId=rows=>new Map((rows||[]).filter(x=>x?.id).map(x=>[String(x.id),x]));
  const c={
    warehouses:byId(cloud.warehouses), suppliers:byId(cloud.suppliers), ingredients:byId(cloud.ingredients),
    products:byId(cloud.products), sales:byId(cloud.sales), saleItems:byId(cloud.saleItems), movements:byId(cloud.movements),
    inventory:new Map(), recipe:new Map(), prepared:new Map(), saleItemSemantic:new Map(), movementSemantic:new Map(), recipeByProduct:new Map(), preparedByIngredient:new Map()
  };

  for(const x of cloud.inventory||[])c.inventory.set(`${x.warehouse_id}|${x.ingredient_id}`,x);
  for(const x of cloud.recipeItems||[]){
    c.recipe.set(`${x.product_id}|${x.ingredient_id}`,x);
    if(!c.recipeByProduct.has(String(x.product_id)))c.recipeByProduct.set(String(x.product_id),[]);
    c.recipeByProduct.get(String(x.product_id)).push(x);
  }
  for(const x of cloud.preparedItems||[]){
    c.prepared.set(`${x.prepared_ingredient_id}|${x.source_ingredient_id}`,x);
    if(!c.preparedByIngredient.has(String(x.prepared_ingredient_id)))c.preparedByIngredient.set(String(x.prepared_ingredient_id),[]);
    c.preparedByIngredient.get(String(x.prepared_ingredient_id)).push(x);
  }
  for(const x of cloud.saleItems||[])c.saleItemSemantic.set([x.sale_id,x.product_id,v228NormNumber(x.quantity),v228NormNumber(x.unit_price)].join('|'),x);
  for(const x of cloud.movements||[])c.movementSemantic.set([String(normalizeTransactionTypeV200(x.transaction_type)||x.transaction_type||''),x.reference_id||'',x.warehouse_id||'',x.ingredient_id||'',v228NormNumber(x.quantity)].join('|'),x);

  let ackedRows=0;
  const ack=(type,rows,find)=>{
    for(const row of rows||[]){
      if(row?._sync_status!=='pending')continue;
      const cloudRow=find(row);
      if(v252ExactPendingMatch(type,row,cloudRow) && v252ClearPendingFlags(row))ackedRows++;
    }
  };

  ack('warehouse',db.warehouses,x=>c.warehouses.get(String(x.id)));
  ack('supplier',db.suppliers,x=>c.suppliers.get(String(x.id)));
  ack('ingredient',db.ingredients,x=>c.ingredients.get(String(x.id)));
  ack('product',db.products,x=>c.products.get(String(x.id)));
  ack('inventory',db.inventory,x=>c.inventory.get(`${x.warehouse_id}|${x.ingredient_id}`));
  ack('recipe_item',db.recipeItems,x=>c.recipe.get(`${x.product_id}|${x.ingredient_id}`));
  ack('prepared_item',db.preparedItems,x=>c.prepared.get(`${x.prepared_ingredient_id}|${x.source_ingredient_id}`));
  ack('sale',db.sales,x=>c.sales.get(String(x.id)));
  ack('sale_item',db.saleItems,x=>c.saleItems.get(String(x.id))||c.saleItemSemantic.get([x.sale_id,x.product_id,v228NormNumber(x.quantity),v228NormNumber(x.unit_price)].join('|')));
  ack('movement',(db.movements||[]).filter(x=>x?._stocktake_audit_only!==true),x=>c.movements.get(String(x.id))||c.movementSemantic.get([String(normalizeTransactionTypeV200(x.transaction_type)||x.transaction_type||''),x.reference_id||'',x.warehouse_id||'',x.ingredient_id||'',v228NormNumber(x.quantity)].join('|')));

  let ackedQueue=0;
  const remaining=[];
  for(const op of getPendingSync()){
    let ok=false;
    if(op?.kind==='save_recipe'){
      const localProduct=(db.products||[]).find(x=>String(x.id)===String(op.product_id));
      const cloudProduct=c.products.get(String(op.product_id));
      const cloudLines=c.recipeByProduct.get(String(op.product_id))||[];
      ok=!!localProduct && !!cloudProduct &&
        v252Same(v236ComparableProduct(localProduct),v236ComparableProduct(cloudProduct)) &&
        v252Same(v236StableRecipeRows(op.lines||[]),v236StableRecipeRows(cloudLines));
      if(ok){
        v252ClearPendingFlags(localProduct);
        for(const r of db.recipeItems||[])if(String(r.product_id)===String(op.product_id))v252ClearPendingFlags(r);
      }
    }else if(op?.kind==='save_ingredient'){
      const localIng=(db.ingredients||[]).find(x=>String(x.id)===String(op.ingredient_id));
      const cloudIng=c.ingredients.get(String(op.ingredient_id));
      ok=!!localIng && !!cloudIng && v252Same(v236ComparableIngredient(localIng),v236ComparableIngredient(cloudIng));

          v252ComparablePrepared(c.preparedByIngredient.get(String(op.ingredient_id))||[])
        );
      }
      if(ok)v252ClearPendingFlags(localIng);
    }

    if(ok)ackedQueue++;
    else remaining.push(op);
  }

  setPendingSync(remaining);
  invalidateDataIndexes();
  invalidateDerivedCaches();
  cacheSave();
  flushCacheSave();
  updatePendingSyncBadge();

  const after=v191PendingCount();
  const report={at:new Date().toISOString(),before,after,ackedRows,ackedQueue};

  return report;
}

function ensureProductWarehouseOwnership(products=db.products){
  const map=getProductWarehouseMap();
  const valid=new Set((db.warehouses||[]).map(w=>String(w.id||'')));
  let needsRepair=false;

  for(const p of products||[]){
    const owner=String(map[p.id]||'');
    if(!owner||!valid.has(owner)){
      needsRepair=true;
      break;
    }

    const history=v252ProductSaleWarehouses(p.id);
    if(history.length && !history.some(x=>x[0]===owner)){
      needsRepair=true;
      break;
    }

    const w=(db.warehouses||[]).find(x=>String(x.id)===owner);
    const pMs=v252ProductFirstSeenMs(p), wMs=v252WarehouseCreatedMs(w);
    if(
      owner!==v252OldestWarehouseId() &&
      v252WarehouseBusinessActivity(owner).empty &&
      pMs>0 && wMs>0 && pMs<wMs-1000
    ){
      needsRepair=true;
      break;
    }
  }

  if(needsRepair)v252RepairProductWarehouseScope();
  return getProductWarehouseMap();
}

function v254InitializeBlankWarehouse(warehouseId){
  if(!warehouseId)return null;

  const createdAt=new Date().toISOString();
  const blank=v254BlankWarehouses();

  blank[warehouseId]={
    created_at:createdAt,
    initial_product_ids:(db.products||[])
      .map(p=>String(p.id||''))
      .filter(Boolean)
  };

  v254SaveBlankWarehouses(blank);

  const saleIds=new Set(
    (db.sales||[])
      .filter(s=>
        String(s.warehouse_id||'')===String(warehouseId)
      )
      .map(s=>String(s.id||''))
  );

  db.inventory=(db.inventory||[])
    .filter(x=>
      String(x.warehouse_id||'')!==String(warehouseId)
    );

  db.movements=(db.movements||[])
    .filter(x=>

    );

  db.sales=(db.sales||[])

      String(x.warehouse_id||'')!==String(warehouseId)
    );

  if(saleIds.size){
    db.saleItems=(db.saleItems||[])
      .filter(x=>
        !saleIds.has(String(x.sale_id||''))
      );
  }

  const map=getProductWarehouseMap();
  for(const [productId,wid] of Object.entries(map)){
    if(String(wid)===String(warehouseId)){
      delete map[productId];
    }
  }
  saveProductWarehouseMap(map);

  const meta=v254ProductAssignMeta();
  for(const [productId,info] of Object.entries(meta)){
    if(String(info?.warehouse_id||'')===String(warehouseId)){
      delete meta[productId];
    }

  v254SaveProductAssignMeta(meta);

  invalidateDataIndexes();
  invalidateDerivedCaches();
  cacheSave();
  flushCacheSave();

  return blank[warehouseId];

function v254ProductAllowedInWarehouse(product,warehouseId){
  if(!product||!warehouseId)return false;

  const blank=v254BlankWarehouses()[String(warehouseId)];
  if(!blank)return true;

  const meta=v254ProductAssignMeta()[String(product.id||'')];

  if(
    !meta?.explicit ||
    String(meta.warehouse_id||'')!==String(warehouseId)
  ){
    return false;

  const assigned=Date.parse(meta.assigned_at||'');
  const created=Date.parse(blank.created_at||'');

  if(Number.isFinite(assigned)&&Number.isFinite(created)){
    return assigned>=created;
  }

  return false;
}

async function q(table,query){

}

async function fetchAllCloudRows(
  table,
  options={}
){
  const {
    orderColumn='',
    ascending=true,
    pageSize=1000
  }=options;

  const rows=[];
  let from=0;

  while(true){
    let query=
      sb.from(table)
        .select('*');

    if(orderColumn){
      query=
        query.order(
          orderColumn,
          {ascending}
        );
    }

    query=
      query.range(
        from,
        from+pageSize-1
      );

    const page=
      await q(
        table,
        query
      );

    rows.push(...page);

    if(page.length<pageSize){
      break;
    }

    from+=pageSize;

    if(from>200000){
      throw new Error(
        `QuÃ¡ nhiá»u dá»¯ liá»‡u á»Ÿ báº£ng ${table}.`
      );
    }
  }

  return rows;
}

function v204MapByKey(rows,keyFn){
  const map=new Map();

  for(const row of rows||[]){
    const key=keyFn(row);
    if(key==null||key==='')continue;
    map.set(String(key),row);
  }

  return map;
}

function v204MergeRows({
  localRows=[],
  cloudRows=[],
  keyFn,
  deletedFn=null
}){
  const cloudMap=v204MapByKey(cloudRows,keyFn);
  const out=[...cloudRows];

  for(const local of localRows||[]){
    const key=String(keyFn(local)??'');

    if(!key)continue;

    if(
      typeof deletedFn==='function' &&
      deletedFn(local)
    ){
      continue;
    }

    const cloud=cloudMap.get(key);

    if(!cloud){
      // Critical V204 rule:
      // absence from Cloud does NOT mean local row is deleted.
      out.push(local);
      continue;
    }

    // Preserve local unsynced metadata/fields only when necessary.
    if(
      local._sync_status==='pending' ||
      local._local_only===true ||
      local._stocktake_audit_only===true
    ){
      const idx=out.indexOf(cloud);
      out[idx]={...cloud,...local};
    }
  }

  return out;
}

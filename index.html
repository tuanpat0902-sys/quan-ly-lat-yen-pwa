<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>Quản Lý Lát Yên</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#102a43;--navy2:#163a5c;--blue:#1570a6;--blue2:#eaf5fb;
  --bg:#f3f6f8;--card:#fff;--text:#1f2933;--muted:#6b7785;
  --line:#d8e0e6;--line2:#e8edf1;--ok:#157347;--warn:#b76e00;--bad:#b42318;
  --shadow:0 1px 3px rgba(16,42,67,.09);
  --r:8px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.42 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.sidebar{background:var(--navy);color:#eaf2f8;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brandmark{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{font-size:15px;display:block}.brand small{opacity:.7}
.nav button{width:100%;border:0;background:transparent;color:#dce8f1;text-align:left;padding:9px 10px;border-radius:7px;margin:2px 0}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:#fff;color:var(--navy);font-weight:800;font-size:13.5px}
.main{min-width:0}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
#pageTitle{font-size:17px;font-weight:800;white-space:nowrap}
.wh-select{min-width:200px}
.cloud{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#aab5be}.dot.ok{background:#26a269}.dot.bad{background:#d64545}
.content{padding:14px;max-width:1600px;margin:auto}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px}
.card+.card{margin-top:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.toolbar h2,.card h2{font-size:16px;margin:0}.card h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)}.right{text-align:right}.nowrap{white-space:nowrap}
.grid{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:12px}.kpi .value{font-size:22px;font-weight:800;margin-top:4px}.kpi .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:7px 10px;font-weight:700}
.btn:hover{background:#f7fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{border-color:#f1b4ae;color:var(--bad);background:#fff7f6}.btn.sm{padding:5px 8px;font-size:12px}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid #cbd5dc;background:#fff;border-radius:6px;padding:7px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#5ca6cf;box-shadow:0 0 0 2px rgba(21,112,166,.1)}
textarea{min-height:70px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
th,td{padding:7px 8px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);vertical-align:middle}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:#edf3f7;color:#435465;text-align:left;font-size:11.5px;z-index:2}
tbody tr:hover{background:#f8fbfd}
.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:#eef2f5;color:#52606d;font-size:11px;font-weight:700}.badge.ok{background:#e7f5ed;color:var(--ok)}.badge.warn{background:#fff3df;color:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(13,30,44,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:10px;width:min(920px,100%);box-shadow:0 16px 50px rgba(0,0,0,.25);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px}
.modal-body{padding:14px}.modal-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.line-list{display:grid;gap:7px}.line-row{display:grid;grid-template-columns:32px minmax(180px,2fr) minmax(90px,1fr) minmax(90px,1fr) minmax(110px,1fr) 34px;gap:6px;align-items:end}
.line-row.recipe{grid-template-columns:32px minmax(220px,2fr) minmax(120px,1fr) 34px}
.toast{position:fixed;right:16px;bottom:16px;background:#172b3a;color:#fff;border-radius:8px;padding:10px 12px;max-width:380px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.22);display:none}.toast.show{display:block}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#1c5576);padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login-card h1{font-size:20px;margin:0 0 6px}.login-card .field{margin-top:14px}
.loading-cover{position:fixed;inset:0;background:rgba(245,248,250,.82);z-index:90;display:none;place-items:center;font-weight:800;color:var(--navy)}.loading-cover.show{display:grid}
.mobile-menu{display:none}
.section-gap{height:12px}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
@media(max-width:900px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:80;left:-230px;width:220px;transition:.18s}.sidebar.open{left:0}
  .mobile-menu{display:inline-flex}.topbar{padding:8px 10px}.wh-select{min-width:145px;max-width:180px}.content{padding:10px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
  .line-row,.line-row.recipe{grid-template-columns:28px 1fr 90px 34px}.line-row .optional-mobile{display:none}
}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="brand" style="color:#102a43;border:0;padding:0;margin:0">
      <div class="brandmark" style="background:#102a43;color:white">LY</div>
      <div><b>QUẢN LÝ LÁT YÊN</b><small style="color:#6b7785">Cloud Business App</small></div>
    </div>
    <h1 style="margin-top:18px">Đăng nhập quản trị</h1>
    <div class="muted">Tài khoản cố định: admin@latyen.vn</div>
    <div class="field"><label>Email</label><input value="admin@latyen.vn" readonly></div>
    <div class="field"><label>Mật khẩu</label><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button id="loginBtn" class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Đăng nhập</button>
    <div id="loginStatus" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<div id="appRoot" class="app" style="display:none">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brandmark">LY</div>
      <div><b id="brandNameSide">QUẢN LÝ LÁT YÊN</b><small>Fresh Cloud</small></div>
    </div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn sm mobile-menu" onclick="toggleSidebar()">☰</button>
        <div id="pageTitle">Tổng quan</div>
        <select id="warehouseSelect" class="wh-select" onchange="changeWarehouse(this.value)"></select>
      </div>
      <div class="cloud"><span id="cloudDot" class="dot"></span><span id="cloudText">Đang kết nối…</span></div>
    </header>
    <main class="content">
      <section id="dashboard" class="panel"></section>
      <section id="ingredients" class="panel"></section>
      <section id="menu" class="panel"></section>
      <section id="imports" class="panel"></section>
      <section id="stocktake" class="panel"></section>
      <section id="sales" class="panel"></section>
      <section id="suppliers" class="panel"></section>
      <section id="warehouses" class="panel"></section>
      <section id="reports" class="panel"></section>
      <section id="history" class="panel"></section>
      <section id="settings" class="panel"></section>
    </main>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast"></div>
<div id="loadingCover" class="loading-cover">Đang tải dữ liệu Cloud…</div>

<script>
const SUPABASE_URL="https://hbffhiipryqvgwpccqtx.supabase.co";
const SUPABASE_KEY="sb_publishable_vYQ760V9ryjwXZfoxBisxw_MHmpcb1b";
const ADMIN_EMAIL='admin@latyen.vn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const TABLES=[
  'ly_warehouses','ly_suppliers','ly_ingredients','ly_prepared_items',
  'ly_products','ly_recipe_items','ly_inventory',
  'ly_import_receipts','ly_import_items',
  'ly_export_receipts','ly_export_items',
  'ly_stocktake_receipts','ly_stocktake_items',
  'ly_sales','ly_sale_items','ly_stock_transactions'
];

const S={
  orgId:null,session:null,warehouseId:'',
  warehouses:[],suppliers:[],ingredients:[],preparedItems:[],
  products:[],recipeItems:[],inventory:[],
  importReceipts:[],importItems:[],exportReceipts:[],exportItems:[],
  stocktakeReceipts:[],stocktakeItems:[],sales:[],saleItems:[],transactions:[],
  active:'dashboard',loading:false,reloadRequested:false,realtime:null,
  realtimeTimer:null,lastLoadAt:0
};

const MAP={
  ly_warehouses:'warehouses',ly_suppliers:'suppliers',ly_ingredients:'ingredients',
  ly_prepared_items:'preparedItems',ly_products:'products',ly_recipe_items:'recipeItems',
  ly_inventory:'inventory',ly_import_receipts:'importReceipts',ly_import_items:'importItems',
  ly_export_receipts:'exportReceipts',ly_export_items:'exportItems',
  ly_stocktake_receipts:'stocktakeReceipts',ly_stocktake_items:'stocktakeItems',
  ly_sales:'sales',ly_sale_items:'saleItems',ly_stock_transactions:'transactions'
};

const NAV=[
  ['dashboard','Tổng quan'],['ingredients','Nguyên liệu / Dụng cụ'],['menu','Thực đơn / Công thức'],
  ['imports','Nhập / Xuất kho'],['stocktake','Kiểm kê'],['sales','Bán hàng'],
  ['suppliers','Nhà cung cấp'],['warehouses','Kho / Chi nhánh'],
  ['reports','Báo cáo'],['history','Lịch sử'],['settings','Cài đặt']
];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const n=v=>Number(v||0);
const money=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(n(v));
const num=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(n(v));
const dateVN=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('vi-VN')};
const dtVN=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('vi-VN')};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>crypto.randomUUID();

function toast(msg,bad=false){
  const el=$('toast'); el.textContent=msg; el.style.background=bad?'#8f1d14':'#172b3a'; el.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200);
}
function setCloud(text,ok=true){$('cloudText').textContent=text;$('cloudDot').className='dot '+(ok?'ok':'bad')}
function busy(show,text='Đang tải dữ liệu Cloud…'){$('loadingCover').textContent=text;$('loadingCover').classList.toggle('show',!!show)}
function openModal(inner){$('modalBox').innerHTML=inner;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open');$('modalBox').innerHTML=''}
async function confirmBox(msg){return window.confirm(msg)}
function requireOnline(){if(!navigator.onLine){toast('Không có mạng. Bản Fresh Cloud không lưu nghiệp vụ offline.',true);return false}return true}

async function login(){
  const p=$('loginPassword').value;
  if(!p)return $('loginStatus').textContent='Nhập mật khẩu.';
  $('loginBtn').disabled=true;$('loginStatus').textContent='Đang đăng nhập…';
  const {data,error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:p});
  $('loginBtn').disabled=false;
  if(error){$('loginStatus').textContent='Đăng nhập thất bại: '+error.message;return}
  S.session=data.session;await boot();
}
async function logout(){
  await sb.auth.signOut();
  if(S.realtime)await sb.removeChannel(S.realtime);
  Object.assign(S,{orgId:null,session:null,warehouseId:'',warehouses:[],suppliers:[],ingredients:[],preparedItems:[],products:[],recipeItems:[],inventory:[],importReceipts:[],importItems:[],exportReceipts:[],exportItems:[],stocktakeReceipts:[],stocktakeItems:[],sales:[],saleItems:[],transactions:[]});
  $('appRoot').style.display='none';$('loginScreen').style.display='grid';$('loginPassword').value='';
}

async function boot(){
  busy(true,'Đang khởi tạo Cloud…');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){$('loginScreen').style.display='grid';$('appRoot').style.display='none';return}
    if(String(session.user.email||'').toLowerCase()!==ADMIN_EMAIL)throw new Error('Chỉ tài khoản admin@latyen.vn được phép sử dụng.');
    S.session=session;
    const {data,error}=await sb.rpc('ly_bootstrap');
    if(error)throw error;
    S.orgId=data;
    $('loginScreen').style.display='none';$('appRoot').style.display='grid';
    buildNav();
    await loadAll();
    setupRealtime();
  }catch(e){
    console.error(e);toast('Khởi tạo thất bại: '+e.message,true);
    $('loginStatus').textContent='Lỗi: '+e.message;
  }finally{busy(false)}
}

async function fetchTable(table,order='created_at',asc=true){
  let q=sb.from(table).select('*').eq('org_id',S.orgId);
  if(order)q=q.order(order,{ascending:asc});
  const {data,error}=await q;
  if(error)throw new Error(`${table}: ${error.message}`);
  return data||[];
}

async function loadAll({silent=false}={}){
  if(!S.orgId)return;
  if(S.loading){S.reloadRequested=true;return}
  S.loading=true;if(!silent)busy(true);
  setCloud('Đang tải Cloud…',true);
  try{
    const result=await Promise.all([
      fetchTable('ly_warehouses','created_at',true),
      fetchTable('ly_suppliers','name',true),
      fetchTable('ly_ingredients','name',true),
      fetchTable('ly_prepared_items','created_at',true),
      fetchTable('ly_products','name',true),
      fetchTable('ly_recipe_items','created_at',true),
      fetchTable('ly_inventory',null,true),
      fetchTable('ly_import_receipts','created_at',false),
      fetchTable('ly_import_items','created_at',true),
      fetchTable('ly_export_receipts','created_at',false),
      fetchTable('ly_export_items','created_at',true),
      fetchTable('ly_stocktake_receipts','created_at',false),
      fetchTable('ly_stocktake_items','line_order',true),
      fetchTable('ly_sales','sold_at',false),
      fetchTable('ly_sale_items','created_at',true),
      fetchTable('ly_stock_transactions','created_at',false)
    ]);
    TABLES.forEach((t,i)=>S[MAP[t]]=result[i]);
    if(!S.warehouseId||!S.warehouses.some(w=>w.id===S.warehouseId))S.warehouseId=S.warehouses[0]?.id||'';
    S.lastLoadAt=Date.now();
    renderWarehouseSelect();renderActive();setCloud('Cloud • Realtime',true);
  }catch(e){
    console.error(e);setCloud('Lỗi tải Cloud',false);toast(e.message,true);
  }finally{
    S.loading=false;if(!silent)busy(false);
    if(S.reloadRequested){S.reloadRequested=false;setTimeout(()=>loadAll({silent:true}),80)}
  }
}

function setupRealtime(){
  if(S.realtime)sb.removeChannel(S.realtime);
  const ch=sb.channel('latyen-fresh-'+S.orgId);
  for(const t of TABLES){
    ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`org_id=eq.${S.orgId}`},()=>{
      clearTimeout(S.realtimeTimer);
      S.realtimeTimer=setTimeout(()=>loadAll({silent:true}),350);
    });
  }
  S.realtime=ch.subscribe(status=>{
    if(status==='SUBSCRIBED')setCloud('Cloud • Realtime',true);
    else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status))setCloud('Realtime gián đoạn',false);
  });
}
window.addEventListener('online',()=>{setCloud('Đang nối lại…',true);setupRealtime();loadAll({silent:true})});
window.addEventListener('offline',()=>setCloud('Offline • chỉ xem dữ liệu đang mở',false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine&&Date.now()-S.lastLoadAt>15000)loadAll({silent:true})});

function buildNav(){
  $('nav').innerHTML=NAV.map(([id,label])=>`<button data-id="${id}" onclick="showPanel('${id}')">${esc(label)}</button>`).join('');
  showPanel(S.active||'dashboard');
}
function showPanel(id){
  S.active=id;
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  $('pageTitle').textContent=NAV.find(x=>x[0]===id)?.[1]||'';
  $('sidebar').classList.remove('open');
  renderActive();
}
function renderActive(){const f=RENDER[S.active];if(f)f()}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
function renderWarehouseSelect(){
  $('warehouseSelect').innerHTML=S.warehouses.map(w=>`<option value="${w.id}" ${w.id===S.warehouseId?'selected':''}>${esc(w.name)}</option>`).join('');
}
function changeWarehouse(id){S.warehouseId=id;renderActive()}
function whName(id){return S.warehouses.find(x=>x.id===id)?.name||'—'}
function ing(id){return S.ingredients.find(x=>x.id===id)}
function product(id){return S.products.find(x=>x.id===id)}
function supplier(id){return S.suppliers.find(x=>x.id===id)}
function stock(ingredientId,warehouseId=S.warehouseId){
  return n(S.inventory.find(x=>x.warehouse_id===warehouseId&&x.ingredient_id===ingredientId)?.quantity)
}
function purchasedIngredients(){return S.ingredients.filter(x=>x.active!==false&&x.ingredient_type==='purchased')}
function productsHere(){return S.products.filter(x=>x.warehouse_id===S.warehouseId&&x.active!==false)}
function recipeFor(pid){return S.recipeItems.filter(x=>x.product_id===pid)}

function tableOrEmpty(head,rows,empty='Chưa có dữ liệu'){
  return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" class="empty">${esc(empty)}</td></tr>`}</tbody></table></div>`;
}

function renderDashboard(){
  const purchased=purchasedIngredients();
  const low=purchased.filter(i=>stock(i.id)<=n(i.minimum_stock));
  const revenue=S.sales.filter(x=>x.warehouse_id===S.warehouseId).reduce((a,x)=>a+n(x.total_amount),0);
  const invValue=purchased.reduce((a,i)=>a+stock(i.id)*n(i.cost),0);
  $('dashboard').innerHTML=`
    <div class="grid grid4">
      <div class="card kpi"><div class="label">Tồn kho giá trị</div><div class="value">${money(invValue)}</div></div>
      <div class="card kpi"><div class="label">Nguyên liệu mua vào</div><div class="value">${purchased.length}</div></div>
      <div class="card kpi"><div class="label">Sắp / hết hàng</div><div class="value ${low.length?'neg':''}">${low.length}</div></div>
      <div class="card kpi"><div class="label">Doanh thu tích lũy</div><div class="value">${money(revenue)}</div></div>
    </div>
    <div class="section-gap"></div>
    <div class="grid grid2">
      <div class="card">
        <div class="toolbar"><h2>Tồn kho cần chú ý</h2><button class="btn sm" onclick="showPanel('ingredients')">Xem nguyên liệu</button></div>

  });
  openModal(`<div class="modal-head"><h2>${r?'Sửa':'Tạo'} phiếu kiểm kê</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="modal-body">
    <div class="grid grid3"><div class="field"><label>Số phiếu *</label><input id="stNo" value="${esc(r?.receipt_no||('KK-'+Date.now().toString().slice(-6)))}"></div><div class="field"><label>Ngày</label><input id="stDate" type="date" value="${r?.receipt_date||today()}"></div><div class="field"><label>Ghi chú</label><input id="stNote" value="${esc(r?.note||'')}"></div></div>
    <div style="margin-top:12px">${tableOrEmpty(['STT','Nguyên liệu','Tồn hệ thống','Thực tế','Chênh lệch','Giá vốn'],rows)}</div><div id="stSummary" class="muted" style="margin-top:8px"></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button id="saveStBtn" class="btn primary" onclick="saveStocktake('${id}')">Lưu phiếu lên Cloud</button></div>`);
  setTimeout(updateStocktakeSummary,0);
}
function updateStocktakeSummary(){
  let shortage=0,surplus=0;
  document.querySelectorAll('.stActual').forEach(el=>{
    const i=ing(el.dataset.ing),sys=stock(el.dataset.ing),diff=n(el.value)-sys,val=diff*n(i?.cost);
    el.closest('tr').querySelector('.stDiff').textContent=(diff>0?'+':'')+num(diff);
    if(val<0)shortage+=Math.abs(val);else surplus+=val;
  });
  $('stSummary').innerHTML=`Giá trị thiếu: <b class="neg">${money(shortage)}</b> • Giá trị thừa: <b class="pos">${money(surplus)}</b>`;
}
async function saveStocktake(id=''){
  if(!requireOnline())return;
  const items=[...document.querySelectorAll('.stActual')].map(el=>({ingredient_id:el.dataset.ing,actual_qty:n(el.value),line_order:n(el.dataset.order)}));
  const h={id:id||null,warehouse_id:S.warehouseId,receipt_no:$('stNo').value.trim(),receipt_date:$('stDate').value,note:$('stNote').value.trim()};
  $('saveStBtn').disabled=true;$('saveStBtn').textContent='Đang ghi Cloud…';
  const {data,error}=await sb.rpc('ly_save_stocktake',{p_header:h,p_items:items});
  if(error){$('saveStBtn').disabled=false;return toast('Lỗi kiểm kê: '+error.message,true)}
  const {data:verify,error:ve}=await sb.from('ly_stocktake_receipts').select('id').eq('id',data).eq('org_id',S.orgId).single();
  if(ve||!verify){$('saveStBtn').disabled=false;return toast('Cloud chưa xác nhận phiếu kiểm kê.',true)}
  await loadAll({silent:true});closeModal();toast('Đã lưu phiếu kiểm kê Cloud');
}

function expandIngredientNeed(ingredientId,qty,stack=new Set()){
  const i=ing(ingredientId);if(!i)return {};
  if(i.ingredient_type!=='prepared')return {[ingredientId]:qty};
  if(stack.has(ingredientId))throw new Error('Phát hiện vòng lặp trong nguyên liệu pha chế: '+i.name);
  const next=new Set(stack);next.add(ingredientId);
  const result={};
  const parts=S.preparedItems.filter(x=>x.prepared_ingredient_id===ingredientId);
  if(!parts.length)throw new Error(`Nguyên liệu pha chế "${i.name}" chưa có thành phần.`);
  for(const p of parts){
    const sub=expandIngredientNeed(p.source_ingredient_id,qty*n(p.quantity),next);
    for(const [id,v] of Object.entries(sub))result[id]=(result[id]||0)+v;
  }
  return result;
}
function productNeeds(productId,qty){
  const result={};const recipe=recipeFor(productId);if(!recipe.length)throw new Error(`Món "${product(productId)?.name||''}" chưa có công thức.`);
  for(const r of recipe){const sub=expandIngredientNeed(r.ingredient_id,qty*n(r.quantity));for(const [id,v] of Object.entries(sub))result[id]=(result[id]||0)+v}
  return result;
}

function renderSales(){
  const rows=S.sales.filter(x=>x.warehouse_id===S.warehouseId);
  $('sales').innerHTML=`<div class="card"><div class="toolbar"><div><h2>Bán hàng</h2><div class="muted">Cloud transaction nguyên tử; cho phép tồn kho âm.</div></div><button class="btn primary" onclick="saleModal()">+ Tạo phiếu bán</button></div>
  ${tableOrEmpty(['STT','Số phiếu','Thời gian','Nguồn','Tổng tiền',''],rows.slice(0,50).map((r,k)=>`<tr><td>${k+1}</td><td><b>${esc(r.receipt_no)}</b></td><td>${dtVN(r.sold_at)}</td><td>${esc(r.source)}</td><td class="right">${money(r.total_amount)}</td><td><div class="row-actions"><button class="btn sm" onclick="saleModal('${r.id}')">Xem/Sửa</button><button class="btn sm danger" onclick="deleteReceipt('SALE','${r.id}')">Xóa</button></div></td></tr>`))}</div>`;
}
function saleModal(id=''){
  const s=id?S.sales.find(x=>x.id===id):null;window._saleSeed=s?S.saleItems.filter(x=>x.sale_id===id):[];
  openModal(`<div class="modal-head"><h2>${s?'Sửa':'Tạo'} phiếu bán hàng</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="modal-body">
    <div class="grid grid3"><div class="field"><label>Số phiếu *</label><input id="saleNo" value="${esc(s?.receipt_no||('BH-'+Date.now().toString().slice(-6)))}"></div><div class="field"><label>Nguồn bán</label><input id="saleSource" value="${esc(s?.source||'Tại quán')}"></div><div class="field"><label>Ghi chú</label><input id="saleNote" value="${esc(s?.note||'')}"></div><div class="field"><label>Giảm giá toàn phiếu</label><input id="saleDiscount" type="number" min="0" value="${n(s?.discount)}" oninput="updateSaleTotal()"></div></div>
    <div style="margin-top:12px"><div class="toolbar"><h3>Món bán</h3><button class="btn sm" onclick="addSaleLine()">+ Thêm món</button></div><div id="saleLines" class="line-list"></div><div id="saleTotalBox" class="right" style="margin-top:10px;font-size:15px"></div></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button id="saveSaleBtn" class="btn primary" onclick="saveSale('${id}')">Lưu phiếu lên Cloud</button></div>`);
  renderSaleLines();updateSaleTotal();
}
function addSaleLine(seed=null){
  const w=$('saleLines'),idx=w.children.length;
  const opts=productsHere().map(p=>`<option value="${p.id}" ${seed?.product_id===p.id?'selected':''}>${esc(p.name)} — ${money(p.selling_price)}</option>`).join('');
  w.insertAdjacentHTML('beforeend',`<div class="line-row recipe"><div class="muted">${idx+1}</div><div><select class="saleProd" onchange="updateSaleTotal()"><option value="">— chọn món —</option>${opts}</select></div><div><input class="saleQty" type="number" min="0.000001" step="any" value="${seed?seed.quantity:1}" oninput="updateSaleTotal()"></div><button class="btn sm danger" onclick="this.parentElement.remove();renumberLines('saleLines');updateSaleTotal()">✕</button></div>`);
}
function renderSaleLines(){const w=$('saleLines');w.innerHTML='';for(const x of window._saleSeed||[])addSaleLine(x);if(!w.children.length)addSaleLine()}
function saleDraft(){
  const items=[...document.querySelectorAll('#saleLines .line-row')].map(r=>{const pid=r.querySelector('.saleProd').value,q=n(r.querySelector('.saleQty').value),p=product(pid);return {product_id:pid,quantity:q,unit_price:n(p?.selling_price),line_total:q*n(p?.selling_price)}}).filter(x=>x.product_id&&x.quantity>0);
  const subtotal=items.reduce((a,x)=>a+x.line_total,0),discount=Math.max(0,n($('saleDiscount')?.value)),total=Math.max(0,subtotal-discount);
  return {items,subtotal,discount,total};
}
function updateSaleTotal(){const d=saleDraft();if($('saleTotalBox'))$('saleTotalBox').innerHTML=`Tạm tính: ${money(d.subtotal)} • Giảm: ${money(d.discount)} • <b>Thanh toán: ${money(d.total)}</b>`}
async function saveSale(id=''){
  if(!requireOnline())return;
  const d=saleDraft();if(!d.items.length)return toast('Thêm ít nhất một món.',true);
  const needs={};
  try{for(const item of d.items){const x=productNeeds(item.product_id,item.quantity);for(const [iid,q] of Object.entries(x))needs[iid]=(needs[iid]||0)+q}}catch(e){return toast(e.message,true)}
  const stockLines=Object.entries(needs).map(([ingredient_id,q])=>({ingredient_id,quantity:-q}));
  const h={id:id||null,warehouse_id:S.warehouseId,receipt_no:$('saleNo').value.trim(),sold_at:new Date().toISOString(),source:$('saleSource').value.trim()||'Tại quán',note:$('saleNote').value.trim(),subtotal:d.subtotal,discount:d.discount,total_amount:d.total};
  $('saveSaleBtn').disabled=true;$('saveSaleBtn').textContent='Đang ghi Cloud…';
  const {data,error}=await sb.rpc('ly_save_sale',{p_header:h,p_sale_items:d.items,p_stock_lines:stockLines});
  if(error){$('saveSaleBtn').disabled=false;return toast('Lỗi bán hàng: '+error.message,true)}
  const {data:verify,error:ve}=await sb.from('ly_sales').select('id').eq('id',data).eq('org_id',S.orgId).single();
  if(ve||!verify){$('saveSaleBtn').disabled=false;return toast('Cloud chưa xác nhận phiếu bán.',true)}
  await loadAll({silent:true});closeModal();toast('Đã lưu phiếu bán Cloud');
}

  const rows=S.suppliers.map((s,k)=>`<tr><td>${k+1}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td>${esc(s.address)}</td><td>${esc(s.note)}</td><td><button class="btn sm" onclick="supplierModal('${s.id}')">Sửa</button></td></tr>`);

function supplierModal(id=''){const s=id?supplier(id):null;openModal(`<div class="modal-head"><h2>${s?'Sửa':'Thêm'} nhà cung cấp</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid grid2"><div class="field"><label>Tên *</label><input id="supName" value="${esc(s?.name||'')}"></div><div class="field"><label>Điện thoại</label><input id="supPhone" value="${esc(s?.phone||'')}"></div><div class="field"><label>Địa chỉ</label><input id="supAddress" value="${esc(s?.address||'')}"></div><div class="field"><label>Ghi chú</label><input id="supNote" value="${esc(s?.note||'')}"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveSupplier('${id}')">Lưu Cloud</button></div>`)}
async function saveSupplier(id=''){
  if(!requireOnline())return;const row={id:id||uid(),org_id:S.orgId,name:$('supName').value.trim(),phone:$('supPhone').value.trim(),address:$('supAddress').value.trim(),note:$('supNote').value.trim()};

function warehouseModal(id=''){const w=id?S.warehouses.find(x=>x.id===id):null;openModal(`<div class="modal-head"><h2>${w?'Sửa':'Thêm'} kho / chi nhánh</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid grid2"><div class="field"><label>Tên *</label><input id="whName" value="${esc(w?.name||'')}"></div><div class="field"><label>Địa chỉ</label><input id="whAddress" value="${esc(w?.address||'')}"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveWarehouse('${id}')">Lưu Cloud</button></div>`)}
async function saveWarehouse(id=''){

function renderReports(){
  const imps=S.importReceipts.filter(x=>x.warehouse_id===S.warehouseId),exps=S.exportReceipts.filter(x=>x.warehouse_id===S.warehouseId),sales=S.sales.filter(x=>x.warehouse_id===S.warehouseId);
  const rev=sales.reduce((a,x)=>a+n(x.total_amount),0),imp=imps.reduce((a,x)=>a+n(x.total_amount),0),exp=exps.reduce((a,x)=>a+n(x.total_amount),0);
  $('reports').innerHTML=`<div class="grid grid4"><div class="card kpi"><div class="label">Doanh thu</div><div class="value">${money(rev)}</div></div><div class="card kpi"><div class="label">Giá trị nhập</div><div class="value">${money(imp)}</div></div><div class="card kpi"><div class="label">Giá trị xuất</div><div class="value">${money(exp)}</div></div><div class="card kpi"><div class="label">Số phiếu</div><div class="value">${sales.length+imps.length+exps.length+S.stocktakeReceipts.filter(x=>x.warehouse_id===S.warehouseId).length}</div></div></div><div class="section-gap"></div><div class="card"><h2>Báo cáo tổng hợp</h2><p class="muted">Bản Fresh Cloud tập trung trước vào dữ liệu chính xác và đồng bộ ổn định. Các báo cáo nâng cao có thể bổ sung trên schema mới mà không ảnh hưởng nghiệp vụ.</p></div>`;
}

function recentReceiptRows(){
  const a=[
    ...S.importReceipts.map(x=>({type:'Nhập kho',code:'IMPORT',id:x.id,no:x.receipt_no,at:x.created_at,amount:x.total_amount,wh:x.warehouse_id})),
    ...S.exportReceipts.map(x=>({type:'Xuất kho',code:'EXPORT',id:x.id,no:x.receipt_no,at:x.created_at,amount:x.total_amount,wh:x.warehouse_id})),
    ...S.stocktakeReceipts.map(x=>({type:'Kiểm kê',code:'STOCKTAKE',id:x.id,no:x.receipt_no,at:x.created_at,amount:x.surplus_value-x.shortage_value,wh:x.warehouse_id})),
    ...S.sales.map(x=>({type:'Bán hàng',code:'SALE',id:x.id,no:x.receipt_no,at:x.sold_at,amount:x.total_amount,wh:x.warehouse_id}))
  ];
  return a.filter(x=>x.wh===S.warehouseId).sort((x,y)=>new Date(y.at)-new Date(x.at));
}
function recentReceiptTable(limit=50){
  const rows=recentReceiptRows().slice(0,limit).map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.type)}</td><td><b>${esc(r.no)}</b></td><td>${dtVN(r.at)}</td><td class="right">${money(r.amount)}</td></tr>`);
  return tableOrEmpty(['STT','Loại','Số phiếu','Thời gian','Giá trị'],rows);
}
function renderHistory(){$('history').innerHTML=`<div class="card"><div class="toolbar"><h2>Lịch sử phiếu</h2><button class="btn sm" onclick="loadAll()">Tải lại Cloud</button></div>${recentReceiptTable(200)}</div>`}

  $('settings').innerHTML=`<div class="grid grid2">

}

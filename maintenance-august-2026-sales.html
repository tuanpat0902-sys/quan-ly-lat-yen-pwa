<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đối soát dữ liệu bán hàng tháng 8/2026</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#172033;background:#f6f8f8}main{background:#fff;border:1px solid #dbe3e7;border-radius:18px;padding:28px}button{border:0;border-radius:10px;padding:12px 18px;background:#b42318;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}pre{white-space:pre-wrap;background:#f2f5f6;padding:16px;border-radius:10px}.muted{color:#64748b}
  </style>
</head>
<body><main>
  <h1>Đối soát tháng 8/2026</h1>
  <p class="muted">Công cụ bảo trì nội bộ. Dữ liệu được sao lưu trước khi xóa và tồn kho được tính lại trong cùng giao dịch.</p>
  <pre id="result">Đang kiểm tra…</pre>
  <button id="purge" type="button" disabled>Xóa dữ liệu tháng 8 và tính lại tồn kho</button>
</main>
<script>
const endpoint='/api/v1/maintenance/purge-august-2026-sales',result=document.querySelector('#result'),button=document.querySelector('#purge');
function show(value){result.textContent=JSON.stringify(value,null,2)}
async function preview(){const response=await fetch(endpoint,{cache:'no-store'}),data=await response.json();show(data);button.disabled=!response.ok||!data.preview}
button.addEventListener('click',async()=>{button.disabled=true;result.textContent='Đang sao lưu, xóa dữ liệu và tính lại tồn kho…';try{const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:'DELETE SALES 2026-08'})}),data=await response.json();show(data);if(!response.ok)button.disabled=false}catch(error){show({ok:false,error:String(error)});button.disabled=false}});
preview().catch(error=>show({ok:false,error:String(error)}));
</script></body></html>
